    <label class="fld dash-search">
      <svg class="search-ic" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/></svg>
      <input id="dash-search" placeholder="Search projects…" autocomplete="off">
      <span class="kbd-pill" id="dash-search-kbd">Ctrl K</span>
      <button type="button" class="clear-btn" id="dash-search-clear" title="Clear search" aria-label="Clear search" hidden><svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>

    <div class="dash-nav-all">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.2" stroke="#1d1d1f" stroke-width="1.4"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2" stroke="#1d1d1f" stroke-width="1.4"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.2" stroke="#1d1d1f" stroke-width="1.4"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2" stroke="#1d1d1f" stroke-width="1.4"/></svg>
      <span>All projects</span>
      <span class="dash-count" id="dash-count">0</span>

    <div class="dash-recent">
      <div class="dash-recent-h">Recent</div>
      <div id="dash-recent-list"></div>
    </div>
    <div class="dash-mcp-card">
      <div class="dash-mcp-top"><span class="live-dot"></span><span>MCP server</span><span class="st">Connected</span></div>
      <div class="mono" id="dash-mcp-url"></div>
      <button type="button" class="btn" id="dash-copy-mcp"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1 1 0 0010 2.5H3.5a1 1 0 00-1 1V10a1 1 0 001 1H5"/></svg>Copy Claude Code command</button>
    </div>
  </aside>
  <div class="dash-main">
    <header class="dash-head">
      <strong id="dash-heading">All projects</strong>
      <span id="dash-summary"></span>
      <div class="dash-controls">
        <label class="fld dash-sort"><span>Sort</span><select id="dash-sort">
          <option value="updated">Last edited</option>
          <option value="name">Name A–Z</option>
          <option value="layers">Most layers</option>
        </select></label>
        <div class="seg dash-seg" role="group" aria-label="View mode">
          <button data-dash-view="grid" class="on" title="Grid view" aria-label="Grid view"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
          <button data-dash-view="list" title="List view" aria-label="List view"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4" rx="1"/><rect x="1" y="6.8" width="14" height="2.4" rx="1"/><rect x="1" y="11.6" width="14" height="2.4" rx="1"/></svg></button>
        </div>
        <button class="btn" id="dash-back"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M6.5 4.5L3 8l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="dash-back-label">Back to canvas</span></button>
        <button class="btn primary" id="dash-new"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>New project</span></button>
      </div>
    </header>
    <div class="dash-body">
      <div class="dash-wrap">
        <div id="dash-content"></div>
        <section class="dash-activity" id="dash-activity"></section>
      </div>
    </div>
  </div>
</section>
<div id="dash-menu" class="menu" role="menu" hidden></div>
<div id="dash-modal" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/root-css.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
