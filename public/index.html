<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper-Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fonts-css" href="/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.29/dist/interact.min.js" defer></script>
<style>
  :root {
    --panel: #252527; --canvas: #1d1d1f; --line: #343438; --field: #323236; --field-h: #3d3d42;
    --row-h: #2f2f33; --row-sel: #393d46; --text: #ededf0; --muted: #9899a1; --accent: #4d93fa;
    --pop: #1c1c1e; --danger: #f2726f; --agent: #b36bff;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #46464c transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #46464c; border-radius: 99px; }
  *::-webkit-scrollbar-thumb:hover { background: #5c5c64; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--text);
    font: 12px/1.4 Inter, "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; }
  #app { display: grid; grid-template-columns: 250px 40px minmax(0, 1fr) 280px; height: 100vh; }
  #app.ui-hidden { grid-template-columns: 0 0 minmax(0, 1fr) 0; }
  #app.ui-hidden .panel, #app.ui-hidden #rail { visibility: hidden; }
  #show-ui { position: absolute; left: 14px; top: 14px; z-index: 15; display: none; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
    background: var(--pop); color: var(--text); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 6px 18px rgb(0 0 0 / 0.4); cursor: pointer; }
  #show-ui:hover { border-color: var(--accent); }
  #app.ui-hidden #show-ui { display: inline-flex; }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #left { border-right: 1px solid var(--line); position: relative; overflow: visible; z-index: 2; }
  .project-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--text);
    font-weight: 600; padding: 5px 6px; border-radius: 6px; cursor: pointer; text-align: left; }
  .project-btn:hover, .project-btn[aria-expanded="true"] { background: var(--row-h); }
  .project-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu { position: absolute; z-index: 20; background: var(--pop); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.45); min-width: 230px; }
  .menu button:not(.btn) { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; color: var(--text);
    padding: 6px 8px; border-radius: 5px; cursor: pointer; text-align: left; }
  .menu button:not(.btn):hover:not(:disabled) { background: var(--accent); color: #fff; }
  .menu button:disabled { opacity: 0.4; cursor: default; }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .menu .label { color: var(--muted); font-size: 11px; padding: 4px 8px; }
  .menu .pn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .menu button:hover .meta { color: #fff; }
  .menu .check-slot { width: 12px; flex: 0 0 12px; }
  .menu .danger { color: var(--danger); }
  .menu .form { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  #project-menu { left: 8px; top: 44px; max-height: 70vh; overflow: auto; }
  #pages { max-height: 28vh; overflow: auto; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .page-row { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 12px; user-select: none; cursor: default; }
  .page-row:hover { background: var(--row-h); }
  .page-row.cur { background: var(--row-sel); }
  .page-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-row .del { visibility: hidden; }
  .page-row:hover .del { visibility: visible; }
  .page-row input { flex: 1; min-width: 0; background: var(--field); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; font: inherit; padding: 2px 4px; outline: none; }
  .font-row { display: flex; align-items: center; gap: 8px; min-height: 26px; }
  .font-row .fam { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .font-row .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .upload { display: flex; align-items: center; justify-content: center; margin-top: 8px; }
  #right { border-left: 1px solid var(--line); }

  /* Left sidebar */
  .file-head { display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 8px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .file-head .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px 4px 12px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .layer-search { padding: 4px 8px 6px; border-bottom: 1px solid var(--line); }
  .layer-search .fld { height: 26px; background: var(--pop); border: 1px solid var(--line); }
  .layer-search .clear-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 13px; line-height: 1; }
  .layer-search .clear-btn:hover { color: var(--text); }
  #layers { flex: 1; min-height: 0; overflow: auto; padding: 2px 0 8px; }
  .row { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 calc(6px + var(--d) * 14px);
    white-space: nowrap; cursor: default; user-select: none; }
  .row:hover { background: var(--row-h); }
  .row.sel { background: var(--row-sel); }
  .row .tw { flex: 0 0 12px; height: 12px; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
  .row .tw::before { content: ""; border: 4px solid transparent; border-left-color: currentColor; border-right-width: 0; transform: translateX(1px); }
  .row .tw.open::before { transform: rotate(90deg) translateX(1px); }
  .row .tw.none::before { display: none; }
  .row .ic { flex: 0 0 14px; color: var(--muted); display: grid; place-items: center; font-size: 10px; font-weight: 600; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .dim { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.75; flex-shrink: 0; }
  .row input { flex: 1; min-width: 0; background: var(--field); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; font: inherit; padding: 2px 4px; outline: none; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .row.drop-inside { outline: 1px solid var(--accent); outline-offset: -1px; }
  .left-foot { padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #live-dot { width: 7px; height: 7px; border-radius: 50%; background: #777; }
  .live #live-dot { background: #5fd068; }

  /* Tool rail */
  #rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
  .tool { width: 30px; height: 30px; border-radius: 6px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .tool:hover { background: var(--row-h); color: var(--text); }
  .tool.on { background: var(--field); color: var(--text); }
  .tool svg { width: 16px; height: 16px; }
  .rail-sep { width: 20px; height: 1px; background: var(--line); margin: 4px 0; }

  /* Stage */
  #stage { position: relative; overflow: hidden; background: var(--canvas); touch-action: none; }
  #stage.tool-frame, #stage.tool-rect { cursor: crosshair; }
  #stage.tool-text { cursor: text; }
  #stage.tool-hand, #stage.pan-ready { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  /* Designs render with browser defaults (not editor chrome styles) so the canvas matches exported HTML. */
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; font: initial; line-height: normal; color: initial; }
  #world [data-node-id] { user-select: none; }
  #world button { font: inherit; color: inherit; } /* same reset as exported HTML */
  #world .editing { user-select: text; cursor: text; outline: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .ab-label { position: absolute; pointer-events: auto; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; user-select: none; padding-bottom: 4px; cursor: default; }
  .ab-label:hover { color: var(--text); }
  .ab-label.sel { color: var(--accent); }
  .box { position: absolute; display: none; }
  #hover-box { border: 1px solid var(--accent); opacity: 0.55; }
  #sel-box { border: 1px solid var(--accent); }
  #sel-box i { position: absolute; width: 7px; height: 7px; background: #fff; border: 1px solid var(--accent); }
  #sel-box .nw { left: -4px; top: -4px; } #sel-box .ne { right: -4px; top: -4px; }
  #sel-box .sw { left: -4px; bottom: -4px; } #sel-box .se { right: -4px; bottom: -4px; }
  #sel-size { position: absolute; top: 100%; left: 50%; transform: translate(-50%, 6px); background: var(--accent); color: #fff;
    font-size: 10px; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  #marquee { border: 1px solid var(--accent); background: rgb(77 147 250 / 0.08); }
  .agent-box { position: absolute; border: 1.5px dashed var(--agent); border-radius: 2px; }
  .agent-box span { position: absolute; left: -1px; bottom: 100%; margin-bottom: 3px; background: var(--agent); color: #fff; font-size: 10px;
    font-weight: 600; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .agent-box.pulse { animation: agent-pulse 1.4s ease-in-out infinite; }
  @keyframes agent-pulse { 50% { border-color: rgb(179 107 255 / 0.35); } }
  .left-foot .agent { margin-left: auto; color: var(--agent); display: none; }
  .left-foot .agent.on { display: inline; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--pop); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 7px; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  /* Right inspector */
  .right-head { position: relative; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .grow { flex: 1; }
  .snap { display: flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; }
  .ghost { background: none; border: 0; color: var(--text); padding: 4px 6px; border-radius: 5px; cursor: pointer; }
  .ghost:hover { background: var(--row-h); }
  #zoom-menu { position: absolute; right: 8px; top: 42px; background: var(--pop); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
    min-width: 190px; z-index: 5; box-shadow: 0 8px 24px rgb(0 0 0 / 0.45); }
  #zoom-menu button { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; color: var(--text); padding: 6px 8px; border-radius: 5px; cursor: pointer; }
  #zoom-menu button:hover { background: var(--accent); }
  kbd { color: var(--muted); font: inherit; }
  #inspector { flex: 1; overflow: auto; }
  .sec { padding: 12px; border-bottom: 1px solid var(--line); }
  .sec-h { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; min-height: 22px; }
  .sec-h .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .sec-h.solo { margin-bottom: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { background: var(--field); color: var(--muted); border: 1px solid transparent; border-radius: 4px; font-size: 10px; height: 22px; padding: 0 7px; cursor: pointer; }
  .chip:hover { background: var(--field-h); color: var(--text); }
  .chip.on { border-color: var(--accent); color: var(--text); }
  .hint { color: var(--muted); font-size: 11px; margin: -2px 0 6px; line-height: 1.4; }
  .hint code { font-family: ui-monospace, Consolas, monospace; font-size: 10px; background: var(--field); padding: 1px 4px; border-radius: 3px; color: var(--text); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin-bottom: 6px; }
  .grid2:last-child { margin-bottom: 0; }
  .fld { display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid transparent; border-radius: 5px; height: 28px; padding: 0 8px; min-width: 0; }
  .fld:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgb(77 147 250 / 0.18); }
  .fld > span { color: var(--muted); flex: 0 0 auto; font-size: 11px; }
  .fld input, .fld select { background: none; border: 0; color: var(--text); font: inherit; width: 100%; min-width: 0; outline: none; padding: 0; }
  .fld select option { background: var(--panel); }
  .fld.wide { grid-column: 1 / -1; }
  .fld.off { opacity: 0.4; }
  .fld > .swatch { position: relative; flex: 0 0 14px; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgb(255 255 255 / 0.24); overflow: hidden; }
  .swatch input { position: absolute; inset: -6px; width: 30px; height: 30px; opacity: 0; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--text); cursor: pointer; margin-top: 2px; }
  .check span { color: var(--muted); margin-left: auto; }
  .flex-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .flex-row > .stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .align-grid { flex: 0 0 76px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--field); border-radius: 5px; padding: 4px; height: 62px; }
  .align-grid button { border: 0; background: none; display: grid; place-items: center; cursor: pointer; border-radius: 3px; padding: 0; }
  .align-grid button::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
  .align-grid button:hover::before { background: var(--text); }
  .align-grid button.on::before { width: 10px; height: 4px; border-radius: 2px; background: var(--accent); }
  .seg { display: flex; background: var(--field); border-radius: 5px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); height: 24px; border-radius: 4px; cursor: pointer; }
  .seg button.on { background: var(--field-h); color: var(--text); }
  .btn { background: var(--field); color: var(--text); border: 0; border-radius: 6px; height: 28px; padding: 0 10px; cursor: pointer; white-space: nowrap; transition: background-color 0.12s, transform 0.08s; }
  .btn:active { transform: translateY(0.5px); }
  .btn:hover { background: var(--field-h); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btnrow { display: flex; gap: 6px; }
  .btnrow .btn { flex: 1; min-width: 0; }
  .icon-btn { background: none; border: 0; color: var(--muted); width: 24px; height: 24px; border-radius: 5px; cursor: pointer; display: grid; place-items: center; font-size: 15px; line-height: 1; }
  .icon-btn:hover { background: var(--row-h); color: var(--text); }
  textarea.code { display: block; width: 100%; min-height: 150px; background: var(--pop); color: var(--text); border: 1px solid var(--line); border-radius: 5px;
    font: 11px/1.5 ui-monospace, Consolas, monospace; padding: 8px; resize: vertical; outline: none; margin-bottom: 6px; }
  textarea.code:focus { border-color: var(--accent); }
  textarea.text { min-height: 60px; font: inherit; }
  .kv { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); padding: 3px 0; }
  .kv b { color: var(--text); font-weight: 500; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; color: var(--text); background: var(--pop);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; margin-bottom: 6px; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }

  /* Dashboard (Paper-style project browser) */
  #dashboard { position: fixed; inset: 0; z-index: 30; background: #222222; display: flex; flex-direction: column; }
  .dash-head { min-height: 56px; padding: 8px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px; flex-shrink: 0; }
  .dash-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; margin-right: auto; }
  .dash-logo { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: 0 0 24px; }
  .dash-count { background: var(--field); color: var(--muted); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; }
  .dash-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .dash-search { width: 220px; }
  .dash-sort { width: auto; min-width: 132px; }
  .dash-seg { width: 64px; flex-shrink: 0; }
  .dash-seg button { display: grid; place-items: center; }
  .dash-body { flex: 1; min-height: 0; overflow: auto; padding: 28px 28px 56px; }
  .dash-wrap { max-width: 1320px; margin: 0 auto; }
  .dash-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; color: var(--muted); font-size: 12px; }
  .dash-bar strong { color: var(--text); font-weight: 600; font-size: 13px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .dash-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.14s, transform 0.14s; }
  .dash-card:hover { border-color: #565656; transform: translateY(-1px); }
  .dash-card.active { border-color: rgb(77 147 250 / 0.7); box-shadow: 0 0 0 1px rgb(77 147 250 / 0.25); }
  .dash-thumb { position: relative; height: 182px; background: var(--canvas); border-bottom: 1px solid var(--line); overflow: hidden; cursor: pointer; }
  .dash-thumb-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; font: initial; line-height: normal; color: initial; }
  .dash-thumb-world * { pointer-events: none !important; }
  .dash-empty-thumb { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: var(--muted); font-size: 11px; }
  .dash-empty-thumb svg { opacity: 0.45; }
  .dash-pill { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; pointer-events: none; }
  .dash-ab-pill { position: absolute; bottom: 10px; right: 10px; background: rgb(20 20 20 / 0.78); border: 1px solid rgb(255 255 255 / 0.1);
    color: var(--text); font-size: 10px; padding: 2px 7px; border-radius: 99px; backdrop-filter: blur(4px); pointer-events: none; }
  .dash-card-foot { display: flex; align-items: center; gap: 8px; padding: 11px 12px 11px 14px; }
  .dash-meta { flex: 1; min-width: 0; cursor: pointer; }
  .dash-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-sub { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-list { display: flex; flex-direction: column; gap: 8px; }
  .dash-row { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; transition: border-color 0.14s; }
  .dash-row:hover { border-color: #565656; }
  .dash-row.active { border-color: rgb(77 147 250 / 0.7); }
  .dash-row .dash-thumb { width: 84px; height: 52px; border: 1px solid var(--line); border-radius: 6px; flex-shrink: 0; }
  .dash-row-stats { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dash-row-stats span { min-width: 68px; text-align: right; }
  .dash-row-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dash-inline-badge { background: rgb(77 147 250 / 0.18); color: var(--accent); font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; flex-shrink: 0; }
  .dash-empty { text-align: center; padding: 64px 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
  .dash-empty p { margin: 0 0 14px; font-size: 13px; }
  #dash-menu { z-index: 40; min-width: 170px; }
  #dash-modal { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.55); display: grid; place-items: center; padding: 16px; }
  .dash-dialog { width: 100%; max-width: 360px; background: var(--pop); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
    box-shadow: 0 16px 40px rgb(0 0 0 / 0.55); display: flex; flex-direction: column; gap: 12px; }
  .dash-dialog h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .dash-dialog p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<datalist id="font-families"></datalist>
<div id="app">
  <aside id="left" class="panel">
    <div class="file-head">
      <button class="icon-btn" id="dash-btn" title="Dashboard — All projects" aria-label="Open Dashboard">

        <span class="nm" id="project-name">…</span><span class="muted">&#9662;</span></button>

    <div class="rail-sep"></div>
    <button class="tool" data-tool="frame" title="Frame (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4.5 1v14M11.5 1v14M1 4.5h14M1 11.5h14"/></svg></button>
    <button class="tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/></svg></button>
    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 2.5h11v3h-1.3l-.4-1.7H8.7v8.4l1.6.4V14H5.7v-1.4l1.6-.4V3.8H4.2l-.4 1.7H2.5z"/></svg></button>
    <div class="rail-sep" style="margin-top:auto"></div>
    <button class="tool" data-cmd="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5H10a3.5 3.5 0 1 1 0 7H7.5"/><path d="M6.5 4 4 6.5 6.5 9"/></svg></button>
    <button class="tool" data-cmd="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 6.5H6a3.5 3.5 0 1 0 0 7h2.5"/><path d="M9.5 4 12 6.5 9.5 9"/></svg></button>
    <button class="tool" data-cmd="fit" title="Zoom to fit (Shift+1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3"/></svg></button>

  <main id="stage">
    <button id="show-ui" type="button" title="Show UI (Ctrl+\\)">Show UI <kbd>Ctrl+\\</kbd></button>

      <span>Projects</span>
      <span class="dash-count" id="dash-count">0</span>
    </div>
    <div class="dash-controls">
      <label class="fld dash-search"><span aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.8"/><path d="m10.8 10.8 3.2 3.2" stroke-linecap="round"/></svg></span><input id="dash-search" placeholder="Search projects…" autocomplete="off"><button type="button" class="icon-btn" id="dash-search-clear" title="Clear search" style="width:18px;height:18px;font-size:13px" hidden>×</button></label>
      <label class="fld dash-sort"><span>Sort</span><select id="dash-sort">
        <option value="updated">Last edited</option>
        <option value="name">Name A–Z</option>
        <option value="layers">Most layers</option>
      </select></label>
      <div class="seg dash-seg" role="group" aria-label="View mode">
        <button data-dash-view="grid" class="on" title="Grid view"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
        <button data-dash-view="list" title="List view"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.4" rx="1"/><rect x="1" y="6.8" width="14" height="2.4" rx="1"/><rect x="1" y="11.6" width="14" height="2.4" rx="1"/></svg></button>

<div id="dash-menu" class="menu" role="menu" hidden></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const CLIENT = Math.random().toString(36).slice(2);
const GRID = 8;
const TEXT_TAGS = new Set(["h1", "h2", "h3", "h4", "h5", "h6", "p", "span", "strong", "em", "small", "label", "a", "button", "li", "figcaption"]);
const VOID_TAGS = new Set(["img", "hr", "br"]);
const SVG_TAGS = new Set(["svg", "g", "path", "circle", "rect", "ellipse", "line", "polyline", "polygon"]);
const SVG_NS = "http://www.w3.org/2000/svg";
const TAGS = ["div", "section", "header", "footer", "nav", "main", "article", "aside", "h1", "h2", "h3", "h4", "h5", "h6", "p", "span",
  "strong", "em", "small", "label", "a", "button", "img", "ul", "ol", "li", "figure", "figcaption", "hr", "br",
  "svg", "g", "path", "circle", "rect", "ellipse", "line", "polyline", "polygon"];

let S = null;                 // canvas state from server
let sel = null;               // selected node id
let hoverId = null;
let tool = "select";
let view = { x: 120, y: 120, z: 1 };
let projects = [];            // [{ id, name, updatedAt, active }]
let fontLib = [];             // font library entries from the server
const GENERIC_FONTS = ["system-ui", "sans-serif", "serif", "monospace", "inherit"];
const viewKey = () => (S ? `paper-lite:view:${S.id}:${S.rootId}` : null);
const expanded = new Set(JSON.parse(localStorage.getItem("paper-lite:expanded") || "[]"));
const saveExpanded = () => localStorage.setItem("paper-lite:expanded", JSON.stringify([...expanded].slice(-400)));
let editingId = null, editOriginal = "", pendingEdit = null, pendingSel = null;
let busy = false, pendingRender = false; // drag/resize in progress
let spaceDown = false;
let inspectorDirty = false;
let agentNodes = [];          // [{ id, label }] nodes an MCP agent is working on

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app"), stage = $("#stage"), world = $("#world"), layersEl = $("#layers"), inspector = $("#inspector");
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const px = (v) => (v == null ? "" : String(v).replace(/^(-?[\d.]+)px$/, "$1"));
const num = (v, fallback = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : fallback; };
const elOf = (id) => world.querySelector(`[data-node-id="${CSS.escape(id)}"]`);
const isArtboard = (id) => S && S.nodes[id] && S.nodes[id].parentId === S.rootId;
const isTextNode = (id) => { const n = S.nodes[id]; return n && !n.children.length && !VOID_TAGS.has(n.tag) && !SVG_TAGS.has(n.tag) && (n.text !== "" || TEXT_TAGS.has(n.tag)); };

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function api(method, url, body) {
  try {
    const res = await fetch(url, {
      method,
      headers: { "content-type": "application/json", "x-client-id": CLIENT },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const ct = res.headers.get("content-type") || "";
    const data = ct.includes("json") ? await res.json() : await res.text();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  } catch (err) {
    toast(err.message);
    return null;
  }
}
const patch = (id, body) => api("PATCH", `/api/nodes/${encodeURIComponent(id)}`, body);
const patchStyles = (id, styles) => patch(id, { styles });

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function buildNodeEl(nodes, id) {
  const n = nodes[id];
  if (!n) return document.createElement("div");
  const svg = SVG_TAGS.has(n.tag);
  const el = svg ? document.createElementNS(SVG_NS, n.tag) : document.createElement(n.tag);
  el.dataset.nodeId = id;
  for (const [k, v] of Object.entries(n.styles || {})) el.style[k] = v;
  if (svg) { for (const [k, v] of Object.entries(n.attrs || {})) el.setAttribute(k, v); (n.children || []).forEach((c) => el.append(buildNodeEl(nodes, c))); return el; }
  for (const [k, v] of Object.entries(n.attrs || {})) el.setAttribute(k, v);
  if (n.tag === "button") el.type = "button";
  if (n.tag === "a" || n.tag === "button") el.tabIndex = -1;
  if (n.tag === "img") el.draggable = false;
  if (VOID_TAGS.has(n.tag)) return el;
  if (n.text) el.append(n.text);
  for (const c of n.children || []) el.append(buildNodeEl(nodes, c));
  return el;
}
const buildEl = (id) => buildNodeEl(S.nodes, id);

function render() {
  if (!S) return;
  if (editingId || busy) { pendingRender = true; return; }
  pendingRender = false;
  if (pendingSel && S.nodes[pendingSel]) { sel = pendingSel; pendingSel = null; shareSelection(); }
  if (sel && !S.nodes[sel]) sel = null;
  if (hoverId && !S.nodes[hoverId]) hoverId = null;
  stage.style.background = S.nodes[S.rootId].styles.backgroundColor || "";
  renderPages();
  world.replaceChildren(...S.nodes[S.rootId].children.map(buildEl));
  if (sel) elOf(sel)?.classList.add("is-selected");
  renderLayers();
  renderInspector();
  updateOverlay();
  if (pendingEdit && elOf(pendingEdit)) { const id = pendingEdit; pendingEdit = null; startEdit(id); }
}

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  $("#zoom-btn").innerHTML = `${Math.round(view.z * 100)}% &#9662;`;
  if (viewKey()) localStorage.setItem(viewKey(), JSON.stringify(view));
  updateOverlay();
}

function rectOnStage(el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
}

function placeBox(box, r) {
  if (!r) { box.style.display = "none"; return; }
  Object.assign(box.style, { display: "block", left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
}

function updateOverlay() {
  if (!S) return;
  // Reuse label elements so an in-progress label drag / double-click keeps its target.
  const labelsEl = $("#labels");
  const keep = new Set();
  for (const id of S.nodes[S.rootId].children) {
    const el = elOf(id);
    if (!el) continue;
    let l = labelsEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!l) { l = document.createElement("div"); l.className = "ab-label"; l.dataset.id = id; labelsEl.append(l); }
    keep.add(l);
    const r = rectOnStage(el);
    if (l.textContent !== S.nodes[id].name) l.textContent = S.nodes[id].name;
    l.classList.toggle("sel", id === sel);
    Object.assign(l.style, { left: `${r.x}px`, top: `${r.y - 20}px`, maxWidth: `${Math.max(40, r.w)}px` });
  }
  for (const l of [...labelsEl.children]) if (!keep.has(l)) l.remove();
  const selEl = sel && elOf(sel);
  const selRect = selEl ? rectOnStage(selEl) : null;
  placeBox($("#sel-box"), selRect);
  if (selEl) $("#sel-size").textContent = `${Math.round(selEl.offsetWidth)} × ${Math.round(selEl.offsetHeight)}`;
  const agentsEl = $("#agents");
  agentsEl.innerHTML = agentNodes.map(({ id, label }) => {
    const el = elOf(id);
    if (!el) return "";
    const r = rectOnStage(el);
    return `<div class="agent-box pulse" style="left:${r.x - 2}px;top:${r.y - 2}px;width:${r.w + 4}px;height:${r.h + 4}px"><span>${esc(label)}</span></div>`;
  }).join("");
  const hovEl = hoverId && hoverId !== sel && elOf(hoverId);
  placeBox($("#hover-box"), hovEl ? rectOnStage(hovEl) : null);
}

const ICONS = {
  frame: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 1v14M11.5 1v14M1 4.5h14M1 11.5h14"/></svg>`,
  row: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="5" height="10" rx="1"/><rect x="9.5" y="3" width="5" height="10" rx="1"/></svg>`,
  col: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="1.5" width="10" height="5" rx="1"/><rect x="3" y="9.5" width="10" height="5" rx="1"/></svg>`,
  box: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/></svg>`,
  vec: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5 14 4v4.5c0 3.3-2.6 5.4-6 6.5-3.4-1.1-6-3.2-6-6.5V4z"/></svg>`,
  img: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M2 12l4-4 3 3 2-2 3 3"/></svg>`,
};
function iconFor(n) {
  if (n.parentId === S.rootId) return ICONS.frame;
  if (n.tag === "img") return ICONS.img;
  if (SVG_TAGS.has(n.tag)) return ICONS.vec;
  if (isTextNode(n.id)) return "Aa";
  if (n.styles.display === "flex") return n.styles.flexDirection === "column" ? ICONS.col : ICONS.row;
  return ICONS.box;
}

let layerFilter = "";
function renderLayers() {
  // Always reveal the selected layer: expand its ancestors (selection can come from the canvas, tools or an agent).
  for (let p = sel && S.nodes[sel]?.parentId; p && p !== S.rootId; p = S.nodes[p]?.parentId) expanded.add(p);
  const q = layerFilter.trim().toLowerCase();
  const out = [];
  if (q) {
    const match = (n) => n.name.toLowerCase().includes(q) || n.tag.toLowerCase().includes(q) || (n.text && n.text.toLowerCase().includes(q));
    const visit = (id) => {
      const n = S.nodes[id];
      if (!n) return;
      if (match(n)) {
        const dim = n.parentId === S.rootId ? `<span class="dim">${esc(px(n.styles.width || "auto"))}×${esc(px(n.styles.height || "auto"))}</span>` : "";
        out.push(`<div class="row${id === sel ? " sel" : ""}" role="treeitem" data-id="${id}" style="--d:0">` +
          `<span class="tw none"></span><span class="ic">${iconFor(n)}</span><span class="nm">${esc(n.name)}</span>${dim}</div>`);
      }
      n.children.forEach(visit);
    };
    S.nodes[S.rootId].children.forEach(visit);
  } else {
    const walk = (id, depth) => {
      const n = S.nodes[id];
      const has = n.children.length > 0;
      const open = expanded.has(id);
      const dim = n.parentId === S.rootId ? `<span class="dim">${esc(px(n.styles.width || "auto"))}×${esc(px(n.styles.height || "auto"))}</span>` : "";
      out.push(`<div class="row${id === sel ? " sel" : ""}" role="treeitem" draggable="true" data-id="${id}" style="--d:${depth}">` +
        `<span class="tw ${has ? (open ? "open" : "") : "none"}" data-twist></span><span class="ic">${iconFor(n)}</span>` +
        `<span class="nm">${esc(n.name)}</span>${dim}</div>`);
      if (has && open) n.children.forEach((c) => walk(c, depth + 1));
    };
    S.nodes[S.rootId].children.forEach((c) => walk(c, 0));
  }
  layersEl.innerHTML = out.join("") || `<div class="kv" style="padding:8px 12px">${q ? "No matching layers." : "No layers yet — press F and draw a frame."}</div>`;
  layersEl.querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
}

// ---------------------------------------------------------------------------
// Inspector
// ---------------------------------------------------------------------------
const fld = (label, key, value, extra = "") =>
  `<label class="fld${extra.includes("disabled") ? " off" : ""}"><span>${label}</span><input data-style="${key}" value="${esc(px(value))}" ${extra}></label>`;
const hex6 = (v) => (/^#[0-9a-f]{6}$/i.test(v || "") ? v : /^#[0-9a-f]{3}$/i.test(v || "") ? `#${[...v.slice(1)].map((c) => c + c).join("")}` : "#000000");
const colorFld = (key, value, placeholder = "none", data = "data-style") =>
  `<label class="fld"><span class="swatch" style="background:${esc(value || "transparent")}"><input type="color" ${data}="${key}" value="${hex6(value)}"></span>` +
  `<input ${data}="${key}" value="${esc(value || "")}" placeholder="${placeholder}"></label>`;

function alignGrid(st) {
  const col = st.flexDirection === "column";
  const vals = ["flex-start", "center", "flex-end"];
  const norm = (v) => (v === "start" ? "flex-start" : v === "end" ? "flex-end" : v || "flex-start");
  const j = norm(st.justifyContent), a = norm(st.alignItems);
  let cells = "";
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const jj = col ? vals[r] : vals[c], aa = col ? vals[c] : vals[r];
    cells += `<button data-action="align" data-j="${jj}" data-a="${aa}" class="${jj === j && aa === a ? "on" : ""}" title="${jj} / ${aa}"></button>`;
  }
  return `<div class="align-grid">${cells}</div>`;
}

function nodePanel(n) {
  const st = n.styles;
  const ab = n.parentId === S.rootId;
  const abs = st.position === "absolute";
  const flex = st.display === "flex" || st.display === "inline-flex";
  const texty = !VOID_TAGS.has(n.tag) && (n.text !== "" || TEXT_TAGS.has(n.tag));
  const posOpts = ["static", "relative", "absolute"].map((p) => `<option ${(st.position || "static") === p ? "selected" : ""}>${p}</option>`).join("");
  const dispOpts = [["", "default"], ["block", "block"], ["flex", "flex"], ["inline-flex", "inline-flex"], ["grid", "grid"], ["inline-block", "inline-block"], ["none", "none"]].map(([v, l]) => `<option value="${v}" ${(st.display || "") === v ? "selected" : ""}>${l}</option>`).join("");
  const tagOpts = TAGS.map((t) => `<option ${t === n.tag ? "selected" : ""}>${t}</option>`).join("");
  const presets = ab ? [["390×844", 390, 844], ["768×1024", 768, 1024], ["1440×900", 1440, 900], ["Auto H", null, "fit-content"]] : [];

function renderInspector(force = false) {
  const a = document.activeElement;
  if (!force && inspector.contains(a) && a.matches("input:not([type=checkbox]):not([type=color]), textarea, select")) { inspectorDirty = true; return; }
  inspectorDirty = false;
  const n = sel && S.nodes[sel];
  const scroll = inspector.scrollTop;
  inspector.innerHTML = n ? nodePanel(n) : pagePanel();
  inspector.scrollTop = scroll;
}

function parseVal(raw, kind) {
  const t = raw.trim();
  if (t === "") return null;
  if (kind === "percent") return Math.max(0, Math.min(100, num(t, 100))) / 100;
  if (kind === "font") return fontStack(t);
  return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : t;
}

inspector.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "font-file") return uploadFonts([...t.files]);
  if (t.id === "google-family") return;
  if (t.id === "css-json") return;
  if (t.dataset.page) return patchStyles(S.rootId, { backgroundColor: t.value || null });
  if (!sel) return;
  if (t.dataset.style) {
    const key = t.dataset.style;
    let value = t.type === "checkbox" ? (t.checked ? t.value : null) : parseVal(t.value, t.dataset.kind);
    if (key === "lineHeight" && typeof value === "number" && value >= 4) value = `${value}px`; // 24 means px, 1.4 is a ratio
    const styles = { [key]: value };
    if (key === "position" && value === "absolute") {
      const el = elOf(sel);
      if (el) Object.assign(styles, { left: Math.round(el.offsetLeft), top: Math.round(el.offsetTop) });
    }
    if (key === "position" && value !== "absolute") Object.assign(styles, { left: null, top: null });
    patchStyles(sel, styles);
  } else if (t.dataset.field) {
    patch(sel, { [t.dataset.field]: t.value });
  } else if (t.dataset.attr) {
    patch(sel, { attrs: { [t.dataset.attr]: t.value || null } });
  }
});
const STEP_KEYS = new Set(["left", "top", "width", "height", "fontSize", "borderRadius", "gap", "padding", "opacity"]);
inspector.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "css-json" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    inspector.querySelector('[data-action="apply-css"]')?.click();
    return;
  }
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && e.target.matches("input[data-style]") && STEP_KEYS.has(e.target.dataset.style)) {
    const raw = e.target.value.trim();
    if (/^-?\d+(\.\d+)?$/.test(raw)) {
      e.preventDefault();
      const step = (e.key === "ArrowUp" ? 1 : -1) * (e.shiftKey ? 10 : 1);
      const next = Math.round((Number(raw) + step) * 100) / 100;
      e.target.value = String(e.target.dataset.kind === "percent" ? Math.max(0, Math.min(100, next)) : next);
      e.target.dispatchEvent(new Event("change", { bubbles: true }));
    }
    return;
  }
  if (e.key === "Enter" && e.target.matches("input")) e.target.blur();
  if (e.key === "Escape" && e.target.matches("input, textarea")) { e.target.blur(); renderInspector(true); }
});
inspector.addEventListener("focusout", () => setTimeout(() => {
  if (inspectorDirty && !inspector.contains(document.activeElement)) renderInspector(true);
}));

inspector.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const act = b.dataset.action;
  if (act === "copy") return copyExport(b.dataset.format, sel);
  if (act === "export-zip") return downloadZip(S?.id, b.dataset.format || "html");
  if (act === "copy-mcp") return copyText($("#mcp-cmd").textContent, "Copied MCP command");
  if (act === "remove-font") {
    const f = fontLib.find((x) => x.id === b.dataset.id);
    if (f && confirm(`Remove ${f.family} from the font library? Layers using it fall back to their fallback fonts.`)) await api("DELETE", `/api/fonts/${encodeURIComponent(f.id)}`);
    return;
  }
  if (act === "add-google") {
    const family = $("#google-family").value.trim();
    if (!family) return toast("Type a Google Fonts family name");
    if (await api("POST", "/api/fonts/google", { family })) toast(`Added ${family}`);
    return;
  }
  if (!sel) return;
  const n = S.nodes[sel];
  if (act === "zoom-sel") return zoomCmd("selection");
  if (act === "preset-size") {
    const styles = { height: b.dataset.h === "fit-content" ? "fit-content" : Number(b.dataset.h) };
    if (b.dataset.w) styles.width = Number(b.dataset.w);
    return patchStyles(sel, styles);
  }
  if (act === "delete") return removeSelected();
  if (act === "duplicate") return duplicateSelected();
  if (act === "flex") return patchStyles(sel, { display: "flex", flexDirection: n.styles.flexDirection || "column", gap: n.styles.gap || 8 });
  if (act === "unflex") return patchStyles(sel, { display: null, flexDirection: null, justifyContent: null, alignItems: null, gap: null, flexWrap: null });
  if (act === "dir") return patchStyles(sel, { flexDirection: b.dataset.dir });
  if (act === "align") return patchStyles(sel, { justifyContent: b.dataset.j, alignItems: b.dataset.a });
  if (act === "textAlign") return patchStyles(sel, { textAlign: b.dataset.v === "left" ? null : b.dataset.v });
  if (act === "clear") return patchStyles(sel, { [b.dataset.key]: null });
  if (act === "apply-css") {
    let styles;
    try { styles = JSON.parse($("#css-json").value); } catch (err) { return toast(`Invalid JSON: ${err.message}`); }
    if (!styles || typeof styles !== "object" || Array.isArray(styles)) return toast("CSS must be a JSON object");
    if (await patch(sel, { styles, replaceStyles: true })) toast("CSS applied");
  }
});

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(msg);
}

async function copyExport(format, nodeId) {
  const q = new URLSearchParams({ format });
  if (nodeId) q.set("nodeId", nodeId);
  const code = await api("GET", `/api/export?${q}`);
  if (typeof code === "string") copyText(code, format === "jsx" ? "Copied JSX" : "Copied HTML + CSS");
}

async function downloadZip(projectId = S?.id, format = "html") {
  if (!projectId) return;
  const q = new URLSearchParams({ projectId, format });
  try {
    const res = await fetch(`/api/export/zip?${q}`);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || res.statusText);
    }
    const blob = await res.blob();
    const cd = res.headers.get("content-disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const fileName = m ? m[1] : "project.zip";
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: fileName });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`Exported ${fileName}`);
  } catch (err) {
    toast(err.message);
  }
}

// ---------------------------------------------------------------------------
// Selection, editing, commands
// ---------------------------------------------------------------------------
function select(id) {
  if (id === sel) return;
  if (editingId) finishEdit(true);
  elOf(sel)?.classList.remove("is-selected");
  sel = id;
  if (sel) { for (let p = S.nodes[sel]?.parentId; p && p !== S.rootId; p = S.nodes[p]?.parentId) expanded.add(p); saveExpanded(); }
  elOf(sel)?.classList.add("is-selected");
  renderLayers();
  renderInspector(true);
  updateOverlay();
  shareSelection();
}

function shareSelection() {
  clearTimeout(shareSelection.t);
  shareSelection.t = setTimeout(() => api("POST", "/api/selection", { ids: sel ? [sel] : [] }), 120);
}

function pathTo(id) {
  const path = [];
  for (let n = S.nodes[id]; n && n.id !== S.rootId; n = S.nodes[n.parentId]) path.unshift(n.id);
  return path;
}

// Paper/Figma-style picking: first click inside an artboard selects its direct child; clicks stay at the
// current depth among siblings; clicking inside the current selection keeps it (so it can be dragged).
function pickTarget(deepest) {
  const path = pathTo(deepest);
  if (sel) {
    const i = path.indexOf(sel);
    if (i > 0) return sel;
    const pi = path.indexOf(S.nodes[sel]?.parentId);
    if (pi >= 0 && path[pi + 1]) return path[pi + 1];
  }
  return path[1] || path[0];
}

function startEdit(id) {
  const el = elOf(id);
  if (!el) { pendingEdit = id; return; }
  if (!isTextNode(id)) return;
  select(id);
  editingId = id;
  editOriginal = S.nodes[id].text;
  el.contentEditable = "plaintext-only";
  if (el.contentEditable !== "plaintext-only") el.contentEditable = "true";
  el.classList.add("editing");
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(range);
  el.addEventListener("keydown", (k) => {
    k.stopPropagation();
    if (k.key === "Escape") { k.preventDefault(); finishEdit(false); }
    else if (k.key === "Enter" && !k.shiftKey) { k.preventDefault(); finishEdit(true); }
  });
  el.addEventListener("input", updateOverlay);
  el.addEventListener("blur", () => finishEdit(true), { once: true });
}

function finishEdit(commit) {
  if (!editingId) return;
  const id = editingId;
  const el = elOf(id);
  editingId = null;
  const text = el ? el.innerText.replace(/\n$/, "") : editOriginal;
  if (el) { el.contentEditable = "false"; el.classList.remove("editing"); }
  getSelection().removeAllRanges();
  if (commit && text !== editOriginal) patch(id, { text });
  else render();
}

async function removeSelected() {
  if (!sel) return;
  const parent = S.nodes[sel].parentId;
  const ok = await api("DELETE", `/api/nodes/${encodeURIComponent(sel)}`);
  if (ok) select(parent === S.rootId ? null : parent);
}

async function duplicateSelected() {
  if (!sel) return;
  const dup = await api("POST", `/api/nodes/${encodeURIComponent(sel)}/duplicate`);
  if (dup) { pendingSel = dup.id; render(); }
}

async function createNode(body, { edit = false } = {}) {
  const node = await api("POST", "/api/nodes", body);
  if (!node) return;
  pendingSel = node.id;
  if (edit) pendingEdit = node.id;
  render();
  setTool("select");
}

function setTool(t) {
  tool = t;
  document.querySelectorAll(".tool").forEach((b) => b.classList.toggle("on", b.dataset.tool === t));
  stage.className = `tool-${t}`;
}

// ---------------------------------------------------------------------------
// View: pan / zoom
// ---------------------------------------------------------------------------
const clampZ = (z) => Math.min(8, Math.max(0.03, z));
function zoomAt(factor, sx, sy) {
  const nz = clampZ(view.z * factor);
  view.x = sx - (sx - view.x) * (nz / view.z);
  view.y = sy - (sy - view.y) * (nz / view.z);
  view.z = nz;
  applyView();
}
function stageCenter() { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; }

function worldBounds(els) {
  if (!els.length) return null;
  const s = stage.getBoundingClientRect();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const el of els) {
    const r = el.getBoundingClientRect();
    x0 = Math.min(x0, (r.left - s.left - view.x) / view.z);
    y0 = Math.min(y0, (r.top - s.top - view.y) / view.z);
    x1 = Math.max(x1, (r.right - s.left - view.x) / view.z);
    y1 = Math.max(y1, (r.bottom - s.top - view.y) / view.z);
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function fitTo(b, maxZ = 2) {
  if (!b) return;
  const r = stage.getBoundingClientRect();
  const pad = 64;
  view.z = clampZ(Math.min((r.width - pad * 2) / Math.max(1, b.w), (r.height - pad * 2) / Math.max(1, b.h), maxZ));
  view.x = (r.width - b.w * view.z) / 2 - b.x * view.z;
  view.y = (r.height - b.h * view.z) / 2 - b.y * view.z;
  applyView();
}

function zoomCmd(mode) {
  const [cx, cy] = stageCenter();
  if (mode === "in") zoomAt(1.25, cx, cy);
  else if (mode === "out") zoomAt(0.8, cx, cy);
  else if (mode === "100") zoomAt(1 / view.z, cx, cy);
  else if (mode === "fit") fitTo(worldBounds([...world.children]), 1);
  else if (mode === "selection") fitTo(sel && elOf(sel) ? worldBounds([elOf(sel)]) : worldBounds([...world.children]), 4);
  toast({ in: "Zoom in", out: "Zoom out", 100: "Zoom to 100%", fit: "Zoom to fit", selection: "Zoom to selection" }[mode]);
}

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.0025), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX; view.y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY; applyView(); }
}, { passive: false });

function startPan(e) {
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("panning");
  let lx = e.clientX, ly = e.clientY;
  const move = (m) => { view.x += m.clientX - lx; view.y += m.clientY - ly; lx = m.clientX; ly = m.clientY; applyView(); };
  const up = () => {
    stage.classList.remove("panning");
    stage.removeEventListener("pointermove", move);
    stage.removeEventListener("pointerup", up);
    stage.removeEventListener("pointercancel", up);
  };
  stage.addEventListener("pointermove", move);
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
}

// ---------------------------------------------------------------------------
// Drawing new layers (Frame / Rectangle / Text tools)
// ---------------------------------------------------------------------------
function startCreate(e) {
  const s = stage.getBoundingClientRect();
  const a = { x: e.clientX - s.left, y: e.clientY - s.top, cx: e.clientX, cy: e.clientY };
  const board = document.elementsFromPoint(e.clientX, e.clientY).find((el) => el.parentElement === world && el.dataset.nodeId);
  const marquee = $("#marquee");
  stage.setPointerCapture(e.pointerId);
  const move = (m) => {
    if (tool === "text") return;
    const bx = m.clientX - s.left, by = m.clientY - s.top;
    placeBox(marquee, { x: Math.min(a.x, bx), y: Math.min(a.y, by), w: Math.abs(bx - a.x), h: Math.abs(by - a.y) });
  };
  const up = (u) => {
    stage.removeEventListener("pointermove", move);
    stage.removeEventListener("pointerup", up);
    placeBox(marquee, null);
    const bx = u.clientX - s.left, by = u.clientY - s.top;
    const dragged = Math.abs(bx - a.x) > 4 || Math.abs(by - a.y) > 4;
    let x = (Math.min(a.x, bx) - view.x) / view.z, y = (Math.min(a.y, by) - view.y) / view.z;
    let w = Math.abs(bx - a.x) / view.z, h = Math.abs(by - a.y) / view.z;
    let parentId = S.rootId;
    if (board) {
      const br = board.getBoundingClientRect();
      parentId = board.dataset.nodeId;
      x = (Math.min(a.cx, u.clientX) - br.left) / view.z;
      y = (Math.min(a.cy, u.clientY) - br.top) / view.z;
    }
    const snap = (v) => ($("#snap").checked ? Math.round(v / GRID) * GRID : Math.round(v));
    const pos = { position: "absolute", left: snap(x), top: snap(y) };
    const top = parentId === S.rootId;
    const count = S.nodes[S.rootId].children.length + 1;
    if (tool === "text") {
      const styles = { ...pos, margin: 0, fontFamily: "system-ui, sans-serif", fontSize: 16, color: top ? "#e6e6e6" : "#0a0b0d", whiteSpace: "pre-wrap" };
      if (top) Object.assign(styles, { width: null, height: null, backgroundColor: null, overflow: null });
      return createNode({ parentId, tag: "p", name: "Text", text: "Text", styles }, { edit: true });
    }
    const size = dragged ? { width: snap(w), height: snap(h) } : top && tool === "frame" ? { width: 390, height: 844 } : { width: 100, height: 100 };
    const fill = tool === "rect" ? "#d9d9d9" : "#ffffff";
    const name = tool === "rect" ? "Rectangle" : top ? `Frame ${count}` : "Frame";
    createNode({ parentId, tag: "div", name, styles: { ...pos, ...size, backgroundColor: fill } });
  };
  stage.addEventListener("pointermove", move);
  stage.addEventListener("pointerup", up);
}

stage.addEventListener("pointerdown", (e) => {
  $("#zoom-menu").hidden = true;
  if (e.target.closest(".ab-label")) return;
  if (e.button === 1 || spaceDown || tool === "hand") { e.preventDefault(); return startPan(e); }
  if (e.button !== 0) return;
  if (editingId && e.target.closest(".editing")) return;
  if (editingId) finishEdit(true);
  if (tool !== "select") { e.preventDefault(); return startCreate(e); }
  const hit = e.target.closest("#world [data-node-id]");
  select(hit ? pickTarget(hit.dataset.nodeId) : null);
});

stage.addEventListener("dblclick", (e) => {
  if (tool !== "select" || editingId) return;
  const hit = e.target.closest("#world [data-node-id]");
  if (!hit) return;
  const path = pathTo(hit.dataset.nodeId);
  const deepest = path[path.length - 1];
  const i = path.indexOf(sel);
  if (isTextNode(deepest) && (sel === deepest || i === path.length - 2)) return startEdit(deepest);
  if (i >= 0 && i < path.length - 1) select(path[i + 1]);
  else if (sel === deepest && isTextNode(deepest)) startEdit(deepest);
});

stage.addEventListener("click", (e) => { if (e.target.closest("#world a, #world button")) e.preventDefault(); }, true);

stage.addEventListener("pointermove", (e) => {

  const id = hit ? pickHover(hit.dataset.nodeId) : null;
  if (id !== hoverId) { hoverId = id; updateOverlay(); }
});
stage.addEventListener("pointerleave", () => { hoverId = null; updateOverlay(); });
function pickHover(deepest) { const p = pathTo(deepest); const i = p.indexOf(sel); return i >= 0 ? p[Math.min(i + 1, p.length - 1)] : pickTarget(deepest); }

$("#labels").addEventListener("pointerdown", (e) => {

// ---------------------------------------------------------------------------
// Drag & resize (interact.js)
// ---------------------------------------------------------------------------
let op = null;
const snapV = (v) => ($("#snap").checked ? Math.round(v / GRID) * GRID : Math.round(v));

function dragStart(e, id, fromLabel = false) {
  const n = S.nodes[id];
  if (!n || tool !== "select" || spaceDown || editingId || n.styles.position !== "absolute" || (!fromLabel && id !== sel)) {
    e.interaction.stop();
    return;
  }
  const el = elOf(id);
  op = { id, el, x0: num(n.styles.left, el.offsetLeft), y0: num(n.styles.top, el.offsetTop), dx: 0, dy: 0 };
  busy = true;
  if (sel !== id) select(id);
}
function dragMove(e) {
  if (!op) return;
  op.dx += e.dx / view.z; op.dy += e.dy / view.z;
  op.x = snapV(op.x0 + op.dx); op.y = snapV(op.y0 + op.dy);
  op.el.style.left = `${op.x}px`; op.el.style.top = `${op.y}px`;
  updateOverlay();
}
function dragEnd() {
  if (!op) return;
  const { id, x, y, x0, y0 } = op;
  op = null; busy = false;
  if (x !== undefined && (x !== x0 || y !== y0)) patchStyles(id, { left: x, top: y });
  else if (pendingRender) render();
}

function resizeStart(e) {
  const id = e.target.dataset.nodeId;
  const n = S.nodes[id];
  if (!n || id !== sel || tool !== "select" || spaceDown || editingId) { e.interaction.stop(); return; }
  const el = e.target;
  op = { id, el, abs: n.styles.position === "absolute", w: el.offsetWidth, h: el.offsetHeight,
    x: num(n.styles.left, el.offsetLeft), y: num(n.styles.top, el.offsetTop), moved: false };
  busy = true;
}
function resizeMove(e) {
  if (!op) return;
  const d = e.deltaRect, z = view.z;
  const canLeft = op.abs || !e.edges.left, canTop = op.abs || !e.edges.top;
  if (canLeft) { op.w = Math.max(1, op.w + d.width / z); if (op.abs) op.x += d.left / z; }
  if (canTop) { op.h = Math.max(1, op.h + d.height / z); if (op.abs) op.y += d.top / z; }
  op.moved = true;
  Object.assign(op.el.style, { width: `${snapV(op.w)}px`, height: `${snapV(op.h)}px` });
  if (op.abs) Object.assign(op.el.style, { left: `${snapV(op.x)}px`, top: `${snapV(op.y)}px` });
  updateOverlay();
}
function resizeEnd() {
  if (!op) return;
  const o = op;
  op = null; busy = false;
  if (!o.moved) { if (pendingRender) render(); return; }
  const styles = { width: snapV(o.w), height: snapV(o.h) };
  if (o.abs) Object.assign(styles, { left: snapV(o.x), top: snapV(o.y) });
  patchStyles(o.id, styles);
}

function setupInteract() {
  if (!window.interact) { toast("interact.js did not load — drag & resize disabled"); return; }
  interact("#world .is-selected")
    .draggable({ listeners: { start: (e) => dragStart(e, e.target.dataset.nodeId), move: dragMove, end: dragEnd } })
    .resizable({ edges: { left: true, right: true, top: true, bottom: true }, margin: 6,
      listeners: { start: resizeStart, move: resizeMove, end: resizeEnd } });
  interact("#labels .ab-label").draggable({ listeners: { start: (e) => dragStart(e, e.target.dataset.id, true), move: dragMove, end: dragEnd } });
}

// Layers panel: select, collapse, rename, drag to reorder / reparent
// ---------------------------------------------------------------------------
layersEl.addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row) return;
  const id = row.dataset.id;
  if (e.target.closest("[data-twist]")) {
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    saveExpanded();
    return renderLayers();
  }
  select(id);
});
layersEl.addEventListener("dblclick", (e) => { const row = e.target.closest(".row"); if (row && !e.target.closest("[data-twist]")) renameRow(row.dataset.id); });
layersEl.addEventListener("pointerover", (e) => { const row = e.target.closest(".row"); const id = row?.dataset.id || null; if (id !== hoverId) { hoverId = id; updateOverlay(); } });
layersEl.addEventListener("pointerleave", () => { hoverId = null; updateOverlay(); });

function renameRow(id) {
  select(id);
  const nm = layersEl.querySelector(`.row[data-id="${CSS.escape(id)}"] .nm`);
  if (!nm) return;
  const input = Object.assign(document.createElement("input"), { value: S.nodes[id].name });
  nm.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    if (save && input.value.trim() && input.value !== S.nodes[id].name) patch(id, { name: input.value.trim() });
    else renderLayers();
  };
  input.addEventListener("keydown", (k) => { k.stopPropagation(); if (k.key === "Enter") finish(true); if (k.key === "Escape") finish(false); });
  input.addEventListener("blur", () => finish(true));
}

let dragRowId = null;
function dropZone(e, row) {
  const r = row.getBoundingClientRect();
  const f = (e.clientY - r.top) / r.height;
  const target = S.nodes[row.dataset.id];
  const canNest = !VOID_TAGS.has(target.tag) && !isTextNode(target.id);
  if (f < 0.3) return "before";
  if (f > 0.7) return "after";
  return canNest ? "inside" : f < 0.5 ? "before" : "after";
}
layersEl.addEventListener("dragstart", (e) => { dragRowId = e.target.closest(".row")?.dataset.id; e.dataTransfer.effectAllowed = "move"; });
layersEl.addEventListener("dragover", (e) => {
  const row = e.target.closest(".row");
  if (!row || !dragRowId) return;
  e.preventDefault();
  layersEl.querySelectorAll(".drop-before,.drop-after,.drop-inside").forEach((r) => r.classList.remove("drop-before", "drop-after", "drop-inside"));
  row.classList.add(`drop-${dropZone(e, row)}`);
});
layersEl.addEventListener("dragleave", (e) => { e.target.closest?.(".row")?.classList.remove("drop-before", "drop-after", "drop-inside"); });
layersEl.addEventListener("drop", (e) => {
  e.preventDefault();
  const row = e.target.closest(".row");
  const id = dragRowId;
  dragRowId = null;
  layersEl.querySelectorAll(".drop-before,.drop-after,.drop-inside").forEach((r) => r.classList.remove("drop-before", "drop-after", "drop-inside"));
  if (!row || !id || row.dataset.id === id) return;
  const target = S.nodes[row.dataset.id];
  let zone = dropZone(e, row);
  // Only artboards live at the top level; anything else dropped beside an artboard goes inside it.
  if (target.parentId === S.rootId && S.nodes[id].parentId !== S.rootId && zone !== "inside") zone = "inside";
  if (S.nodes[id].parentId === S.rootId && target.parentId !== S.rootId) return toast("Artboards stay at the top level");
  if (zone === "inside") return patch(id, { parentId: target.id });
  const parent = S.nodes[target.parentId];
  let index = parent.children.indexOf(target.id) + (zone === "after" ? 1 : 0);
  const cur = parent.children.indexOf(id);
  if (cur >= 0 && cur < index) index -= 1;
  patch(id, { parentId: parent.id, index });
});
layersEl.addEventListener("dragend", () => { dragRowId = null; });

function fontStack(value) {
  const t = String(value || "").trim();
  if (!t || t.includes(",")) return t;
  const name = t.replace(/^['"]|['"]$/g, "");
  if (GENERIC_FONTS.includes(name.toLowerCase())) return name.toLowerCase();
  const lib = fontLib.find((f) => f.family.toLowerCase() === name.toLowerCase());
  const fam = lib ? lib.family : name;
  return `'${fam}', ${/mono|code/i.test(fam) ? "ui-monospace, monospace" : "system-ui, sans-serif"}`;
}

function renderFontList() {
  const fams = [...new Set(fontLib.map((f) => f.family))];
  $("#font-families").innerHTML = [...fams, ...GENERIC_FONTS].map((f) => `<option value="${esc(f)}"></option>`).join("");
}

const readAsBase64 = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(String(r.result).split(",")[1] || "");
  r.onerror = () => reject(r.error);
  r.readAsDataURL(file);
});

async function uploadFonts(files) {
  let ok = 0;
  for (const file of files) {
    const res = await api("POST", "/api/fonts", { fileName: file.name, data: await readAsBase64(file) });
    if (res) ok += 1;
  }
  if (ok) toast(`Added ${ok} font file${ok > 1 ? "s" : ""}`);
}

function countLayers(id) {
  return 1 + S.nodes[id].children.reduce((a, c) => a + countLayers(c), 0);
}

const projectMenu = $("#project-menu");
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!Number.isFinite(s)) return "";
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString();
}
