<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper-Lite</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cpath d='M7.5 3 H19.5 L26.5 10 V26.5 C26.5 27.88 25.38 29 24 29 H7.5 C6.12 29 5 27.88 5 26.5 V5.5 C5 4.12 6.12 3 7.5 3 Z' fill='%230000ff'/%3E%3Cpath d='M19.5 3 L26.5 10 H21 C20.17 10 19.5 9.33 19.5 8.5 V3 Z' fill='%239ab8ff'/%3E%3Crect x='10' y='13.5' width='11.5' height='10.5' rx='1.6' stroke='%23ffffff' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fonts-css" href="/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.29/dist/interact.min.js" defer></script>
<style>
  :root {
    --panel: #ffffff;
    --canvas: #f4f6f8;
    --stage: #eef2f6;
    --line: #dde3e9;
    --field: #f4f6f8;
    --field-h: #e9eef3;
    --row-h: #f4f6f8;
    --row-sel: #eff3ff;
    --text: #0a0b0d;
    --muted: #787878;
    --accent: #0000ff;
    --accent-h: #0000cc;
    --pop: #ffffff;
    --danger: #d92d20;
    --agent: #7c3aed;
    --agent-bg: #faf5ff;
    --agent-pill: #f3e8ff;
    --agent-line: #d8b4fe;
    --live: #1e8a4c;
    --shadow-float: 0 16px 36px rgba(10, 11, 13, 0.14);
    --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #cfd6de transparent; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfd6de; border-radius: 99px; }
  *::-webkit-scrollbar-thumb:hover { background: #aeb7c2; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--canvas); color: var(--text);
    font: 12px/1.4 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  #app { display: grid; grid-template-columns: 252px 44px minmax(0, 1fr) 292px; height: 100vh; }
  #app.ui-hidden { grid-template-columns: 0 0 minmax(0, 1fr) 0; }
  #app.ui-hidden .panel, #app.ui-hidden #rail { visibility: hidden; }
  #show-ui {
    position: absolute; left: 14px; top: 14px; z-index: 15; display: none;
    align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    background: var(--pop); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow-float); cursor: pointer; font-weight: 500;
  }
  #show-ui:hover { border-color: var(--accent); color: var(--accent); }
  #app.ui-hidden #show-ui { display: inline-flex; }

  .panel { background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #left { border-right: 1px solid var(--line); position: relative; overflow: visible; z-index: 2; }
  #right { border-left: 1px solid var(--line); }

  /* Left header & project menu */
  .file-head {
    display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 10px;
    border-bottom: 1px solid var(--line); font-weight: 600; flex-shrink: 0;
  }
  .dash-trigger {
    width: 26px; height: 26px; border-radius: 6px; border: 0;
    background: var(--canvas); color: var(--text);
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .dash-trigger:hover { background: var(--row-sel); color: var(--accent); }
  .project-btn {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px;
    background: none; border: 0; color: var(--text); font-weight: 600; font-size: 12px;
    padding: 5px 6px; border-radius: 6px; cursor: pointer; text-align: left;
  }
  .project-btn:hover, .project-btn[aria-expanded="true"] { background: var(--row-h); }
  .project-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .menu {
    position: absolute; z-index: 25; background: var(--pop); border: 1px solid var(--line);
    border-radius: 10px; padding: 5px; box-shadow: var(--shadow-float); min-width: 232px;
  }
  .menu button:not(.btn) {
    display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0;
    color: var(--text); padding: 6px 9px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 12px;
  }
  .menu button:not(.btn):hover:not(:disabled) { background: var(--accent); color: #fff; }
  .menu button:disabled { opacity: 0.4; cursor: default; }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .menu .label {
    color: var(--muted); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 9px 3px;
  }
  .menu .pn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .meta { color: var(--muted); font-family: var(--font-mono); font-size: 10px; white-space: nowrap; }
  .menu button:hover .meta { color: rgba(255, 255, 255, 0.85); }
  .menu .check-slot { width: 12px; flex: 0 0 12px; font-weight: 600; }
  .menu .danger { color: var(--danger); }
  .menu button.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
  .menu .form { padding: 6px; display: flex; flex-direction: column; gap: 8px; }
  #project-menu { left: 8px; top: 46px; max-height: 70vh; overflow: auto; }

  /* Pages & Layers */
  .section-title {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 8px 4px 12px; font-family: var(--font-mono); font-weight: 500;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); flex-shrink: 0;
  }
  #pages { max-height: 26vh; overflow: auto; padding: 0 8px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .page-row {
    display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px;
    border-radius: 6px; user-select: none; cursor: pointer;
  }
  .page-row:hover { background: var(--row-h); }
  .page-row.cur { background: var(--row-sel); color: var(--accent); font-weight: 600; }
  .page-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-row .pg-cnt { font-family: var(--font-mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .page-row.cur .pg-cnt { color: var(--accent); }
  .page-row .del { display: none; width: 18px; height: 18px; font-size: 13px; }
  .page-row:hover .del { display: grid; }
  .page-row input {
    flex: 1; min-width: 0; background: #fff; color: var(--text);
    border: 1px solid var(--accent); border-radius: 5px; font: inherit; padding: 2px 5px; outline: none;
  }

  .layer-search { padding: 4px 10px 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .layer-search .fld { height: 28px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; }
  .layer-search .clear-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 13px; line-height: 1; }
  .layer-search .clear-btn:hover { color: var(--text); }
  .kbd-pill {
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    flex-shrink: 0; pointer-events: none;
  }

  #layers { flex: 1; min-height: 0; overflow: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: flex; align-items: center; gap: 6px; height: 28px; min-height: 28px;
    padding: 0 8px 0 calc(8px + var(--d) * 14px); border-radius: 6px;
    white-space: nowrap; cursor: default; user-select: none;
  }
  .row:hover { background: var(--row-h); }
  .row.sel { background: var(--row-sel); color: var(--accent); font-weight: 600; }
  .row.agent-editing:not(.sel) { background: var(--agent-bg); }
  .row .tw { flex: 0 0 12px; height: 12px; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
  .row.sel .tw { color: var(--accent); }
  .row .tw::before { content: ""; border: 4px solid transparent; border-left-color: currentColor; border-right-width: 0; transform: translateX(1px); }
  .row .tw.open::before { transform: rotate(90deg) translateX(1px); }
  .row .tw.none::before { display: none; }
  .row .ic {
    flex: 0 0 15px; color: var(--muted); display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  }
  .row.sel .ic { color: var(--accent); }
  .row.agent-editing .ic { color: var(--agent); }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .dim {
    color: var(--muted); font-family: var(--font-mono); font-size: 10px;
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .row.sel .dim { color: var(--accent); }
  .mcp-badge {
    font-family: var(--font-mono); font-size: 9px; font-weight: 600;
    padding: 1px 5px; border-radius: 999px; background: var(--agent-pill); color: var(--agent);
    flex-shrink: 0;
  }
  .row input {
    flex: 1; min-width: 0; background: #fff; color: var(--text);
    border: 1px solid var(--accent); border-radius: 5px; font: inherit; padding: 2px 5px; outline: none;
  }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .row.drop-inside { outline: 1px solid var(--accent); outline-offset: -1px; }

  .left-foot {
    height: 40px; padding: 0 12px; border-top: 1px solid var(--line); color: var(--muted);
    display: flex; align-items: center; gap: 6px; font-size: 11px; flex-shrink: 0;
  }
  #live-dot { width: 7px; height: 7px; border-radius: 50%; background: #aeb7c2; flex-shrink: 0; }
  .live #live-dot { background: var(--live); }
  .left-foot .agent {
    margin-left: auto; display: none;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px; background: var(--agent-pill); color: var(--agent);
  }
  .left-foot .agent.on { display: inline-flex; align-items: center; }

  /* Tool rail */
  #rail {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0;
  }
  .tool {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid transparent;
    background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer;
    transition: background-color 0.1s, color 0.1s, border-color 0.1s;
  }
  .tool:hover { background: var(--row-h); color: var(--text); }
  .tool.on { background: var(--row-sel); border-color: var(--accent); color: var(--accent); }
  .tool svg { width: 15px; height: 15px; }
  .tool.help-btn {
    background: var(--canvas); color: var(--text); font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
  }
  .tool.help-btn:hover { border-color: var(--line); background: var(--field-h); }
  .rail-sep { width: 20px; height: 1px; background: var(--line); margin: 2px 0; }

  /* Stage */
  #app.ui-hidden #stage-hud, #app.ui-hidden #ctx-bar { display: none !important; }
  #stage { position: relative; overflow: hidden; background: var(--canvas); touch-action: none; min-width: 0; container-type: inline-size; container-name: stage; }
  #stage.tool-frame, #stage.tool-rect { cursor: crosshair; }
  #stage.tool-text { cursor: text; }
  #stage.tool-hand, #stage.pan-ready { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; font: initial; line-height: normal; color: initial; }
  #world [data-node-id] { user-select: none; }
  #world button { font: inherit; color: inherit; }
  #world .editing { user-select: text; cursor: text; outline: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }

  #stage-pill {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
    max-width: calc(100% - 24px); overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    pointer-events: auto; cursor: pointer; white-space: nowrap;
  }
  #stage-pill .pg-nm { overflow: hidden; text-overflow: ellipsis; }
  #stage-pill .pill-short, #stage-hud .hud-short { display: none; }
  #stage-pill:hover { border-color: var(--accent); }
  #stage-pill .pg-nm { color: var(--accent); font-weight: 500; }
  #app.ui-hidden #stage-pill { display: none; }

  .ab-label {
    position: absolute; pointer-events: auto; color: var(--muted);
    font-family: var(--font-sans); font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: none; padding-bottom: 4px; cursor: default;
  }
  .ab-label:hover { color: var(--text); }
  .ab-label.sel { color: var(--accent); font-weight: 600; }
  .box { position: absolute; display: none; }
  #hover-box { border: 1px solid var(--accent); opacity: 0.45; }
  #sel-box { border: 1.5px solid var(--accent); }
  #sel-box i { position: absolute; width: 7px; height: 7px; background: #fff; border: 1.5px solid var(--accent); }
  #sel-box .nw { left: -4px; top: -4px; } #sel-box .ne { right: -4px; top: -4px; }
  #sel-box .sw { left: -4px; bottom: -4px; } #sel-box .se { right: -4px; bottom: -4px; }
  #sel-size {
    position: absolute; top: 100%; left: 50%; transform: translate(-50%, 6px);
    background: var(--accent); color: #fff; font-family: var(--font-mono);
    font-size: 10px; font-variant-numeric: tabular-nums;
    padding: 2px 7px; border-radius: 4px; white-space: nowrap;
  }
  #marquee { border: 1.5px solid var(--accent); background: rgba(0, 0, 255, 0.06); }

  /* UX #02: Contextual quick-action bar above selection */
  #ctx-bar {
    position: absolute; display: none; pointer-events: auto; z-index: 13;
    align-items: center; gap: 3px; padding: 4px 6px;
    background: var(--pop); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 20px rgba(10, 11, 13, 0.08); white-space: nowrap;
  }
  #ctx-bar .ctx-name {
    font-size: 11px; font-weight: 600; color: var(--accent);
    padding: 2px 6px; max-width: 140px; overflow: hidden; text-overflow: ellipsis;
  }
  #ctx-bar .ctx-sep { width: 1px; height: 14px; background: var(--line); margin: 0 2px; }
  #ctx-bar button {
    background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 500;
    padding: 3px 7px; border-radius: 5px; cursor: pointer;
  }
  #ctx-bar button:hover { background: var(--row-h); color: var(--text); }
  #ctx-bar button.primary-act { color: var(--text); }
  #ctx-bar button.primary-act:hover { background: var(--row-sel); color: var(--accent); }

  /* UX #06: MCP Agent Presence */
  .agent-box { position: absolute; border: 1.5px dashed var(--agent); border-radius: 6px; }
  .agent-box span {
    position: absolute; left: -1px; bottom: 100%; margin-bottom: 4px;
    background: var(--agent); color: #fff; font-family: var(--font-mono);
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
  }
  .agent-box.pulse { animation: agent-pulse 1.4s ease-in-out infinite; }
  @keyframes agent-pulse { 50% { border-color: rgba(124, 58, 237, 0.35); } }

  /* UX #01: Floating Canvas HUD */
  #stage-hud {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 14;
    display: flex; align-items: center; gap: 4px; padding: 5px 8px; max-width: calc(100% - 16px);
    background: var(--pop); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-float); white-space: nowrap;
  }
  @container stage (max-width: 580px) {
    #stage-pill .pill-hint { display: none; }
    #stage-pill .pill-short { display: inline; }
  }
  @container stage (max-width: 520px) {
    #stage-hud { padding: 4px 5px; gap: 2px; }
    #stage-hud .hud-btn { padding: 4px 6px; font-size: 10px; }
    #stage-hud .hud-sep { margin: 0 1px; }
    #stage-hud .hud-long { display: none; }
    #stage-hud .hud-short { display: inline; }
  }
  @media (max-width: 1120px) { #app { grid-template-columns: 220px 42px minmax(0, 1fr) 264px; } }
  @media (max-width: 860px) { #app { grid-template-columns: 192px 38px minmax(0, 1fr) 236px; } }
  .hud-sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  .hud-btn {
    border: 0; background: none; color: var(--muted); padding: 4px 8px; border-radius: 6px;
    cursor: pointer; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
  }
  .hud-btn:hover { background: var(--row-h); color: var(--text); }
  .hud-btn.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
  .hud-btn.snap-on { background: var(--row-sel); color: var(--accent); font-family: var(--font-mono); font-weight: 600; }
  .hud-btn.cmd-btn { background: var(--canvas); color: var(--text); font-family: var(--font-mono); }
  .hud-btn.cmd-btn:hover { background: var(--field-h); }

  #zoom-menu {
    position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
    background: var(--pop); border: 1px solid var(--line); border-radius: 10px; padding: 5px;
    min-width: 196px; z-index: 20; box-shadow: var(--shadow-float);
  }
  #zoom-menu button {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: none; border: 0; color: var(--text); padding: 6px 9px; border-radius: 6px; cursor: pointer;
  }
  #zoom-menu button:hover { background: var(--accent); color: #fff; }
  #zoom-menu button:hover kbd { color: rgba(255, 255, 255, 0.85); }
  kbd { color: var(--muted); font-family: var(--font-mono); font-size: 10px; }

  #toast {
    position: fixed; left: 50%; bottom: 68px; transform: translateX(-50%); z-index: 60;
    background: var(--text); color: #fff; padding: 7px 13px; border-radius: 8px;
    box-shadow: var(--shadow-float); font-size: 11px; font-weight: 500;
    opacity: 0; transition: opacity 0.18s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* Right inspector */
  .right-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 48px; padding: 0 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .right-id { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .type-pill {
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px; background: var(--canvas); color: var(--text); flex-shrink: 0;
  }
  .type-pill.ab { background: var(--row-sel); color: var(--accent); }
  .right-title {
    font-size: 12px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .right-acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .right-acts .del-act { color: var(--danger); }
  .right-acts .del-act:hover { background: #fef2f2; color: var(--danger); }
  .right-meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }

  #inspector { flex: 1; min-height: 0; overflow: auto; }
  #inspector-foot {
    padding: 12px; border-top: 1px solid var(--line); background: var(--panel); flex-shrink: 0;
  }
  .sec { padding: 12px; border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .sec-h {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono); font-weight: 500; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin-bottom: 8px; min-height: 22px;
  }
  .sec-h .muted { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--font-sans); font-size: 11px; }
  .sec-h.solo { margin-bottom: 0; }
  .link-toggle {
    background: none; border: 0; color: var(--accent); font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; cursor: pointer; padding: 2px 4px; border-radius: 4px;
    text-transform: none; letter-spacing: 0;
  }
  .link-toggle:hover { background: var(--row-sel); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip {
    background: var(--field); color: var(--muted); border: 1px solid var(--line);
    border-radius: 5px; font-family: var(--font-mono); font-size: 10px; height: 22px; padding: 0 7px; cursor: pointer;
  }
  .chip:hover { background: var(--field-h); color: var(--text); }
  .chip.on { border-color: var(--accent); background: var(--row-sel); color: var(--accent); font-weight: 500; }

  .hint { color: var(--muted); font-size: 11px; margin: -2px 0 6px; line-height: 1.4; }
  .hint code { font-family: var(--font-mono); font-size: 10px; background: var(--field); padding: 1px 4px; border-radius: 3px; color: var(--text); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin-bottom: 6px; }
  .grid2:last-child { margin-bottom: 0; }
  .fld {
    display: flex; align-items: center; gap: 6px; background: var(--field);
    border: 1px solid transparent; border-radius: 6px; height: 28px; padding: 0 8px; min-width: 0;
    transition: border-color 0.12s, background-color 0.12s, box-shadow 0.12s;
  }
  .fld:focus-within { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.1); }
  .fld > span { color: var(--muted); flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; }
  .fld input, .fld select { background: none; border: 0; color: var(--text); font: inherit; width: 100%; min-width: 0; outline: none; padding: 0; }
  .fld input[data-style] { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .fld select option { background: var(--panel); color: var(--text); }
  .fld.wide { grid-column: 1 / -1; }
  .fld.off { opacity: 0.48; }
  .fld > .swatch {
    position: relative; flex: 0 0 14px; width: 14px; height: 14px;
    border-radius: 4px; border: 1px solid var(--line); overflow: hidden;
  }
  .fld > .swatch.empty {
    background-color: #fff;
    background-image: linear-gradient(135deg, transparent 43%, #d92d20 43%, #d92d20 57%, transparent 57%);
  }
  .swatch input { position: absolute; inset: -6px; width: 30px; height: 30px; opacity: 0; cursor: pointer; }

  .check { display: flex; align-items: center; gap: 6px; color: var(--text); cursor: pointer; margin-top: 4px; font-size: 12px; }
  .check input { accent-color: var(--accent); }
  .check span { color: var(--muted); margin-left: auto; }

  .flex-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .flex-row > .stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .align-grid {
    flex: 0 0 74px; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 5px; height: 62px;
  }
  .align-grid button { border: 0; background: none; display: grid; place-items: center; cursor: pointer; border-radius: 3px; padding: 0; }
  .align-grid button::before { content: ""; width: 4px; height: 4px; border-radius: 99px; background: #9ca3af; }
  .align-grid button:hover::before { background: var(--text); }
  .align-grid button.on::before { width: 10px; height: 4px; border-radius: 2px; background: var(--accent); }

  .seg {
    display: flex; background: var(--field); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px; gap: 2px;
  }
  .seg button {
    flex: 1; border: 1px solid transparent; background: none; color: var(--muted);
    height: 24px; border-radius: 5px; cursor: pointer; font-size: 11px;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--panel); border-color: var(--line); color: var(--text); font-weight: 500; }

  .btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; height: 30px; padding: 0 11px; cursor: pointer;
    white-space: nowrap; font-weight: 500; font-size: 12px;
    transition: background-color 0.12s, border-color 0.12s, transform 0.08s;
  }
  .btn:active { transform: translateY(0.5px); }
  .btn:hover { background: var(--canvas); border-color: #c7d0da; }
  .btn.subtle { background: var(--canvas); border-color: transparent; }
  .btn.subtle:hover { background: var(--field-h); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-h); border-color: var(--accent-h); }
  .btn.danger { color: var(--danger); border-color: var(--line); background: var(--panel); }
  .btn.danger:hover { background: #fef2f2; border-color: #fecaca; }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger-solid:hover { background: #b42318; border-color: #b42318; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .btn { flex: 1; min-width: 0; }
  #inspector-foot .btn.primary { flex: 1.4; }
  .icon-btn {
    background: none; border: 0; color: var(--muted); width: 24px; height: 24px;
    border-radius: 6px; cursor: pointer; display: grid; place-items: center; font-size: 14px; line-height: 1;
  }
  .icon-btn:hover { background: var(--row-h); color: var(--text); }

  textarea.code {
    display: block; width: 100%; min-height: 140px; background: var(--field); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 11px/1.5 var(--font-mono); padding: 8px; resize: vertical; outline: none; margin-bottom: 8px;
  }
  textarea.code:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.08); }
  textarea.text { min-height: 60px; font: inherit; }

  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--muted); padding: 3px 0; font-size: 11px; }
  .kv b { color: var(--text); font-weight: 500; text-align: right; font-family: var(--font-mono); font-size: 10px; }
  .mono {
    font-family: var(--font-mono); font-size: 10px; word-break: break-all; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px;
  }
  .muted { color: var(--muted); }
  .font-row { display: flex; align-items: center; gap: 8px; min-height: 26px; }
  .font-row .fam { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--text); }
  .font-row .meta { color: var(--muted); font-family: var(--font-mono); font-size: 10px; white-space: nowrap; }
  .upload { display: flex; align-items: center; justify-content: center; margin-top: 8px; }
  .mcp-live-tag { font-family: var(--font-mono); font-size: 10px; color: var(--live); text-transform: none; letter-spacing: 0; }
  [hidden] { display: none !important; }

  /* UX #04: Command Palette (⌘K) */
  #cmdk {
    position: fixed; inset: 0; z-index: 55; background: rgba(10, 11, 13, 0.16);
    display: grid; place-items: center; padding: 20px;
  }
  .cmdk-box {
    width: 100%; max-width: 480px; background: var(--pop); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow-float); overflow: hidden;
    display: flex; flex-direction: column; max-height: 72vh;
  }
  .cmdk-head {
    height: 46px; padding: 0 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .cmdk-head input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font: 13px/1.4 var(--font-sans); color: var(--text);
  }
  .cmdk-head input::placeholder { color: var(--muted); }
  .cmdk-esc {
    font-family: var(--font-mono); font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: var(--canvas); border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  }
  .cmdk-list { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .cmdk-group {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 6px 10px 4px;
  }
  .cmdk-sep { height: 1px; background: var(--line); margin: 6px 4px; }
  .cmdk-item {
    height: 34px; padding: 0 10px; border-radius: 7px; border: 0; background: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    cursor: pointer; text-align: left; width: 100%; color: var(--text); font-size: 12px;
  }
  .cmdk-item.on, .cmdk-item:hover { background: var(--row-sel); color: var(--accent); font-weight: 600; }
  .cmdk-item .cmdk-sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted); font-weight: 400; flex-shrink: 0; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-item.on .cmdk-sub, .cmdk-item:hover .cmdk-sub { color: var(--accent); }
  .cmdk-empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 12px; }

  /* Projects Dashboard (Light Precision) */
  #dashboard { position: fixed; inset: 0; z-index: 30; background: var(--canvas); display: flex; flex-direction: column; }
  .dash-head {
    min-height: 60px; padding: 10px 28px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px; flex-shrink: 0;
  }
  .dash-brand {
    display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
    letter-spacing: -0.02em; margin-right: auto;
  }
  .dash-logo { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 28px; }
  .dash-count {
    background: var(--canvas); color: var(--muted); font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px;
  }
  .dash-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .dash-controls .fld { height: 32px; border-radius: 7px; border: 1px solid var(--line); }
  .dash-search { width: 220px; background: var(--canvas); }
  .dash-sort { width: auto; min-width: 140px; background: var(--panel); }
  .dash-sort select { font-weight: 500; }
  .dash-seg { width: 64px; flex-shrink: 0; height: 32px; padding: 2px; }
  .dash-seg button { display: grid; place-items: center; height: 26px; }
  .dash-controls .btn { height: 32px; padding: 0 13px; }
  .dash-body { flex: 1; min-height: 0; overflow: auto; padding: 32px 48px 56px; }
  .dash-wrap { max-width: 1344px; margin: 0 auto; }
  .dash-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
  .dash-bar strong { color: var(--text); font-weight: 600; font-size: 14px; }
  #dash-summary { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .dash-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.14s, transform 0.14s;
  }
  .dash-card:hover { border-color: #aeb7c2; transform: translateY(-1px); }
  .dash-card.active { border: 1.5px solid var(--accent); }
  .dash-thumb {
    position: relative; height: 196px; background: var(--stage);
    border-bottom: 1px solid var(--line); overflow: hidden; cursor: pointer;
  }
  .dash-thumb-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; font: initial; line-height: normal; color: initial; }
  .dash-thumb-world * { pointer-events: none !important; }
  .dash-empty-thumb {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--muted); font-family: var(--font-mono); font-size: 11px;
  }
  .dash-empty-thumb svg { opacity: 0.6; }
  .dash-pill {
    position: absolute; top: 12px; left: 12px; background: var(--accent); color: #fff;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; pointer-events: none;
  }
  .dash-ab-pill {
    position: absolute; bottom: 10px; right: 12px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); font-family: var(--font-mono);
    font-size: 10px; padding: 2px 8px; border-radius: 99px; pointer-events: none;
  }
  .dash-card-foot { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .dash-meta { flex: 1; min-width: 0; cursor: pointer; }
  .dash-name { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dash-list { display: flex; flex-direction: column; gap: 10px; max-width: 1040px; }
  .dash-row {
    display: flex; align-items: center; gap: 14px; height: 68px; padding: 0 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; transition: border-color 0.14s;
  }
  .dash-row:hover { border-color: #aeb7c2; }
  .dash-row.active { border: 1.5px solid var(--accent); }
  .dash-row .dash-thumb { width: 84px; height: 48px; border: 1px solid var(--line); border-radius: 6px; flex-shrink: 0; }
  .dash-row .dash-name { font-size: 13px; }
  .dash-row .dash-sub { font-family: var(--font-sans); margin-top: 2px; }
  .dash-row-stats {
    display: flex; align-items: center; gap: 16px; color: var(--muted);
    font-family: var(--font-mono); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .dash-row-stats span { min-width: 78px; text-align: right; }
  .dash-row-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dash-inline-badge {
    background: var(--row-sel); color: var(--accent); font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; padding: 1px 7px; border-radius: 99px; flex-shrink: 0;
  }
  .dash-empty { text-align: center; padding: 64px 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); background: var(--panel); }
  .dash-empty p { margin: 0 0 14px; font-size: 13px; }
  #dash-menu { z-index: 40; min-width: 196px; }
  #dash-modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 11, 13, 0.25);
    display: grid; place-items: center; padding: 16px;
  }
  .dash-dialog {
    width: 100%; max-width: 380px; background: var(--pop); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; box-shadow: var(--shadow-float);
    display: flex; flex-direction: column; gap: 14px;
  }
  .dash-dialog h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }
  .dash-dialog p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .dash-dialog .fld { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
  .dash-dialog .fld input { font-size: 13px; }
  .dash-dialog .btn { height: 34px; border-radius: 8px; }
  @media (max-width: 720px) {
    .dash-head { padding: 10px 16px; }
    .dash-body { padding: 20px 16px 40px; }
    .dash-search { width: 100%; }
    .dash-row-stats { display: none; }
  }
</style>
</head>
<body>
<datalist id="font-families"></datalist>
<div id="app">
  <aside id="left" class="panel">
    <div class="file-head">
      <button class="dash-trigger" id="dash-btn" title="Dashboard — All projects (Ctrl+Shift+P)" aria-label="Open Dashboard">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      </button>
      <button class="project-btn" id="project-btn" aria-haspopup="menu" aria-expanded="false" title="Projects">
        <span class="nm" id="project-name">…</span><span class="muted">&#9662;</span>
      </button>
      <button class="icon-btn" id="hide-ui" title="Hide UI (Ctrl+\)">&#8676;</button>
    </div>
    <div id="project-menu" class="menu" role="menu" hidden></div>
    <div class="section-title">Pages <button class="icon-btn" id="add-page" title="New page">+</button></div>
    <div id="pages"></div>
    <div class="section-title">Layers <button class="icon-btn" id="add-artboard" title="New artboard">+</button></div>
    <div class="layer-search">
      <label class="fld">
        <input id="layer-filter" placeholder="Filter layers…" autocomplete="off">
        <span class="kbd-pill" id="layer-filter-kbd">⌘F</span>
        <button type="button" class="clear-btn" id="layer-filter-clear" title="Clear filter" hidden>×</button>
      </label>
    </div>
    <div id="layers" role="tree"></div>
    <div class="left-foot" id="live">
      <span id="live-dot"></span>
      <span id="live-text">Connecting…</span>
      <span class="agent" id="agent-status"></span>
    </div>
  </aside>

  <nav id="rail" aria-label="Tools">
    <button class="tool on" data-tool="select" title="Select (V)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5v12.2l3.3-3.1 2.2 4.9 2-.9-2.2-4.8 4.5-.3z"/></svg></button>
    <button class="tool" data-tool="hand" title="Hand (H) — or hold Space"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8V3.5a1 1 0 0 1 2 0V7m0-4.5v-.5a1 1 0 0 1 2 0V7m0-4a1 1 0 0 1 2 0v4m0-2.5a1 1 0 0 1 2 0V10a5 5 0 0 1-5 5h-.5A4.5 4.5 0 0 1 3.2 12L1.8 9.2a1 1 0 0 1 1.7-1L5 10"/></svg></button>
    <div class="rail-sep"></div>
    <button class="tool" data-tool="frame" title="Frame (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.5 1v14M11.5 1v14M1 4.5h14M1 11.5h14"/></svg></button>
    <button class="tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/></svg></button>
    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 2.5h11v3h-1.3l-.4-1.7H8.7v8.4l1.6.4V14H5.7v-1.4l1.6-.4V3.8H4.2l-.4 1.7H2.5z"/></svg></button>
    <div class="rail-sep" style="margin-top:auto"></div>
    <button class="tool" data-cmd="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5H10a3.5 3.5 0 1 1 0 7H7.5"/><path d="M6.5 4 4 6.5 6.5 9"/></svg></button>
    <button class="tool" data-cmd="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 6.5H6a3.5 3.5 0 1 0 0 7h2.5"/><path d="M9.5 4 12 6.5 9.5 9"/></svg></button>
    <button class="tool" data-cmd="fit" title="Zoom to fit (Shift+1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3"/></svg></button>
    <button class="tool help-btn" data-cmd="cmdk" title="Command Palette (Ctrl+K)">?</button>
  </nav>

  <main id="stage">
    <button id="show-ui" type="button" title="Show UI (Ctrl+\)">Show UI <kbd>Ctrl+\</kbd></button>
    <div id="stage-pill" title="Open Command Palette (Ctrl+K)">
      <span class="pg-nm" id="stage-page-name">Page 1</span>
      <span>·</span>
      <span class="pill-hint">Press ⌘K for quick jump or F for frame</span>
      <span class="pill-short">⌘K</span>
    </div>
    <div id="world"></div>
    <div id="overlay">
      <div id="labels"></div>
      <div id="hover-box" class="box"></div>
      <div id="sel-box" class="box"><i class="nw"></i><i class="ne"></i><i class="sw"></i><i class="se"></i><span id="sel-size"></span></div>
      <div id="ctx-bar" role="toolbar" aria-label="Quick actions">
        <span class="ctx-name" id="ctx-name"></span>
        <span class="ctx-sep"></span>
        <button type="button" class="primary-act" data-ctx="copy">Copy HTML</button>
        <button type="button" data-ctx="duplicate">Duplicate</button>
        <button type="button" data-ctx="flex" id="ctx-flex">+ Flex</button>
      </div>
      <div id="marquee" class="box"></div>
      <div id="agents"></div>
    </div>
    <div id="stage-hud" role="toolbar" aria-label="Canvas viewport controls">
      <input type="checkbox" id="snap" hidden>
      <button type="button" class="hud-btn" id="snap-btn" title="Snap moves and resizes to an 8px grid (Shift+G)">Snap 8px</button>
      <span class="hud-sep"></span>
      <div style="position:relative">
        <button type="button" class="hud-btn mono" id="zoom-btn" aria-haspopup="menu">100% &#9662;</button>
        <div id="zoom-menu" role="menu" hidden>
          <button data-zoom="in">Zoom in <kbd>Ctrl +</kbd></button>
          <button data-zoom="out">Zoom out <kbd>Ctrl −</kbd></button>
          <button data-zoom="100">Zoom to 100% <kbd>Shift 0</kbd></button>
          <button data-zoom="fit">Zoom to fit <kbd>Shift 1</kbd></button>
          <button data-zoom="selection">Zoom to selection <kbd>Shift 2</kbd></button>
        </div>
      </div>
      <span class="hud-sep"></span>
      <button type="button" class="hud-btn" id="hud-fit" title="Zoom to fit (Shift+1)">Fit ⇧1</button>
      <span class="hud-sep"></span>
      <button type="button" class="hud-btn cmd-btn" id="hud-cmdk" title="Command Palette (Ctrl+K)"><span class="hud-long">⌘K Command</span><span class="hud-short">⌘K</span></button>
      <span class="hud-sep"></span>
      <button type="button" class="hud-btn" id="hud-hide-ui" title="Hide UI (Ctrl+\)"><span class="hud-long">Hide UI ⌘\</span><span class="hud-short">Hide</span></button>
    </div>
  </main>

  <aside id="right" class="panel">
    <div class="right-head" id="right-head"></div>
    <div id="inspector"></div>
    <div id="inspector-foot" hidden></div>
  </aside>
</div>

<div id="cmdk" role="dialog" aria-modal="true" aria-label="Command Palette" hidden>
  <div class="cmdk-box">
    <div class="cmdk-head">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#0000ff" stroke-width="1.6"><circle cx="7" cy="7" r="4.8"/><path d="m10.8 10.8 3.2 3.2" stroke-linecap="round"/></svg>
      <input id="cmdk-input" placeholder="Jump to layer, page, tool, or action…" autocomplete="off">
      <button type="button" class="cmdk-esc" id="cmdk-esc">ESC</button>
    </div>
    <div class="cmdk-list" id="cmdk-list"></div>
  </div>
</div>

<section id="dashboard" aria-label="Projects Dashboard" hidden>
  <header class="dash-head">
    <div class="dash-brand">
      <span class="dash-logo">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <path d="M7.5 3 H19.5 L26.5 10 V26.5 C26.5 27.88 25.38 29 24 29 H7.5 C6.12 29 5 27.88 5 26.5 V5.5 C5 4.12 6.12 3 7.5 3 Z" fill="#0000ff"/>
          <path d="M19.5 3 L26.5 10 H21 C20.17 10 19.5 9.33 19.5 8.5 V3 Z" fill="#9ab8ff"/>
          <rect x="10" y="13.5" width="11.5" height="10.5" rx="1.6" stroke="#ffffff" stroke-width="2.1"/>
          <rect x="8.6" y="12.1" width="3.6" height="3.6" rx="0.6" fill="#ffffff"/>
          <rect x="19.3" y="21.8" width="3.6" height="3.6" rx="0.6" fill="#ffffff"/>
        </svg>
      </span>
      <span>Paper-Lite</span>
      <span class="muted">/</span>
      <span style="font-weight:500">Projects</span>
      <span class="dash-count" id="dash-count">0</span>
    </div>
    <div class="dash-controls">
      <label class="fld dash-search">
        <span aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.8"/><path d="m10.8 10.8 3.2 3.2" stroke-linecap="round"/></svg></span>
        <input id="dash-search" placeholder="Search projects…" autocomplete="off">
        <span class="kbd-pill" id="dash-search-kbd">⌘K</span>
        <button type="button" class="icon-btn" id="dash-search-clear" title="Clear search" style="width:18px;height:18px;font-size:13px" hidden>×</button>
      </label>
      <label class="fld dash-sort"><span>Sort</span><select id="dash-sort">
        <option value="updated">Last edited</option>
        <option value="name">Name A–Z</option>
        <option value="layers">Most layers</option>
      </select></label>
      <div class="seg dash-seg" role="group" aria-label="View mode">
        <button data-dash-view="grid" class="on" title="Grid view"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
        <button data-dash-view="list" title="List view"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.4" rx="1"/><rect x="1" y="6.8" width="14" height="2.4" rx="1"/><rect x="1" y="11.6" width="14" height="2.4" rx="1"/></svg></button>
      </div>
      <button class="btn primary" id="dash-new">+ New project</button>
      <button class="btn" id="dash-back">← Back to canvas</button>
    </div>
  </header>
  <div class="dash-body">
    <div class="dash-wrap">
      <div class="dash-bar"><strong id="dash-heading">All projects</strong><span id="dash-summary"></span></div>
      <div id="dash-content"></div>
    </div>
  </div>
</section>
<div id="dash-menu" class="menu" role="menu" hidden></div>
<div id="dash-modal" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const CLIENT = Math.random().toString(36).slice(2);
const GRID = 8;
const TEXT_TAGS = new Set(["h1", "h2", "h3", "h4", "h5", "h6", "p", "span", "strong", "em", "small", "label", "a", "button", "li", "figcaption"]);
const VOID_TAGS = new Set(["img", "hr", "br"]);
const SVG_TAGS = new Set(["svg", "g", "path", "circle", "rect", "ellipse", "line", "polyline", "polygon"]);
const SVG_NS = "http://www.w3.org/2000/svg";
const TAGS = ["div", "section", "header", "footer", "nav", "main", "article", "aside", "h1", "h2", "h3", "h4", "h5", "h6", "p", "span",
  "strong", "em", "small", "label", "a", "button", "img", "ul", "ol", "li", "figure", "figcaption", "hr", "br",
  "svg", "g", "path", "circle", "rect", "ellipse", "line", "polyline", "polygon"];

let S = null;                 // canvas state from server
let sel = null;               // selected node id
let hoverId = null;
let tool = "select";
let view = { x: 120, y: 120, z: 1 };
let projects = [];            // [{ id, name, updatedAt, active }]
let fontLib = [];             // font library entries from the server
const GENERIC_FONTS = ["system-ui", "sans-serif", "serif", "monospace", "inherit"];
const viewKey = () => (S ? `paper-lite:view:${S.id}:${S.rootId}` : null);
const expanded = new Set(JSON.parse(localStorage.getItem("paper-lite:expanded") || "[]"));
const saveExpanded = () => localStorage.setItem("paper-lite:expanded", JSON.stringify([...expanded].slice(-400)));
let editingId = null, editOriginal = "", pendingEdit = null, pendingSel = null;
let busy = false, pendingRender = false; // drag/resize in progress
let spaceDown = false;
let inspectorDirty = false;
let cssJsonOpen = false;      // UX #03: collapsed raw CSS JSON by default
let agentNodes = [];          // [{ id, label }] nodes an MCP agent is working on

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app"), stage = $("#stage"), world = $("#world"), layersEl = $("#layers"),
  inspector = $("#inspector"), rightHead = $("#right-head"), inspectorFoot = $("#inspector-foot");
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const px = (v) => (v == null ? "" : String(v).replace(/^(-?[\d.]+)px$/, "$1"));
const num = (v, fallback = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : fallback; };
const elOf = (id) => world.querySelector(`[data-node-id="${CSS.escape(id)}"]`);
const isArtboard = (id) => S && S.nodes[id] && S.nodes[id].parentId === S.rootId;
const isTextNode = (id) => { const n = S.nodes[id]; return n && !n.children.length && !VOID_TAGS.has(n.tag) && !SVG_TAGS.has(n.tag) && (n.text !== "" || TEXT_TAGS.has(n.tag)); };
const isDarkColor = (c) => {
  const m = /^#?([0-9a-f]{6})$/i.exec((c || "").trim());
  if (!m) return false;
  const n = parseInt(m[1], 16);
  const lum = (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
  return lum < 0.45;
};

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function api(method, url, body) {
  try {
    const res = await fetch(url, {
      method,
      headers: { "content-type": "application/json", "x-client-id": CLIENT },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const ct = res.headers.get("content-type") || "";
    const data = ct.includes("json") ? await res.json() : await res.text();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  } catch (err) {
    toast(err.message);
    return null;
  }
}
const patch = (id, body) => api("PATCH", `/api/nodes/${encodeURIComponent(id)}`, body);
const patchStyles = (id, styles) => patch(id, { styles });

// Snap state synced with Floating HUD button
const snapInput = $("#snap"), snapBtn = $("#snap-btn");
function setSnap(on) {
  snapInput.checked = Boolean(on);
  snapBtn.classList.toggle("snap-on", snapInput.checked);
  snapBtn.setAttribute("aria-pressed", String(snapInput.checked));
  localStorage.setItem("paper-lite:snap", snapInput.checked ? "1" : "0");
}
setSnap(localStorage.getItem("paper-lite:snap") === "1");
snapBtn.addEventListener("click", () => { setSnap(!snapInput.checked); toast(snapInput.checked ? "Snap 8px on" : "Snap 8px off"); });

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function buildNodeEl(nodes, id) {
  const n = nodes[id];
  if (!n) return document.createElement("div");
  const svg = SVG_TAGS.has(n.tag);
  const el = svg ? document.createElementNS(SVG_NS, n.tag) : document.createElement(n.tag);
  el.dataset.nodeId = id;
  for (const [k, v] of Object.entries(n.styles || {})) el.style[k] = v;
  if (svg) { for (const [k, v] of Object.entries(n.attrs || {})) el.setAttribute(k, v); (n.children || []).forEach((c) => el.append(buildNodeEl(nodes, c))); return el; }
  for (const [k, v] of Object.entries(n.attrs || {})) el.setAttribute(k, v);
  if (n.tag === "button") el.type = "button";
  if (n.tag === "a" || n.tag === "button") el.tabIndex = -1;
  if (n.tag === "img") el.draggable = false;
  if (VOID_TAGS.has(n.tag)) return el;
  if (n.text) el.append(n.text);
  for (const c of n.children || []) el.append(buildNodeEl(nodes, c));
  return el;
}
const buildEl = (id) => buildNodeEl(S.nodes, id);

function render() {
  if (!S) return;
  if (editingId || busy) { pendingRender = true; return; }
  pendingRender = false;
  if (pendingSel && S.nodes[pendingSel]) { sel = pendingSel; pendingSel = null; shareSelection(); }
  if (sel && !S.nodes[sel]) sel = null;
  if (hoverId && !S.nodes[hoverId]) hoverId = null;
  stage.style.background = S.nodes[S.rootId].styles.backgroundColor || "";
  $("#stage-page-name").textContent = S.nodes[S.rootId].name || "Page 1";
  renderPages();
  world.replaceChildren(...S.nodes[S.rootId].children.map(buildEl));
  if (sel) elOf(sel)?.classList.add("is-selected");
  renderLayers();
  renderInspector();
  updateOverlay();
  if (pendingEdit && elOf(pendingEdit)) { const id = pendingEdit; pendingEdit = null; startEdit(id); }
}

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  $("#zoom-btn").innerHTML = `${Math.round(view.z * 100)}% &#9662;`;
  if (viewKey()) localStorage.setItem(viewKey(), JSON.stringify(view));
  updateOverlay();
}

function rectOnStage(el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
}

function placeBox(box, r) {
  if (!r) { box.style.display = "none"; return; }
  Object.assign(box.style, { display: "block", left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
}

function updateOverlay() {
  if (!S) return;
  const labelsEl = $("#labels");
  const keep = new Set();
  for (const id of S.nodes[S.rootId].children) {
    const el = elOf(id);
    if (!el) continue;
    let l = labelsEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!l) { l = document.createElement("div"); l.className = "ab-label"; l.dataset.id = id; labelsEl.append(l); }
    keep.add(l);
    const r = rectOnStage(el);
    if (l.textContent !== S.nodes[id].name) l.textContent = S.nodes[id].name;
    l.classList.toggle("sel", id === sel);
    Object.assign(l.style, { left: `${r.x}px`, top: `${r.y - 20}px`, maxWidth: `${Math.max(40, r.w)}px` });
  }
  for (const l of [...labelsEl.children]) if (!keep.has(l)) l.remove();
  const selEl = sel && elOf(sel);
  const selRect = selEl ? rectOnStage(selEl) : null;
  placeBox($("#sel-box"), selRect);
  if (selEl) $("#sel-size").textContent = `${Math.round(selEl.offsetWidth)} × ${Math.round(selEl.offsetHeight)}`;

  // UX #02: Contextual quick-action bar above selection (kept clear of artboard label, pill & HUD)
  const ctxBar = $("#ctx-bar");
  const selNode = sel && S.nodes[sel];
  const onStage = selRect && selRect.x + selRect.w > 0 && selRect.x < stage.clientWidth && selRect.y + selRect.h > 44 && selRect.y < stage.clientHeight;
  if (onStage && selNode && !busy && !editingId && !app.classList.contains("ui-hidden") && tool === "select") {
    $("#ctx-name").textContent = selNode.name;
    const canFlex = !VOID_TAGS.has(selNode.tag) && !SVG_TAGS.has(selNode.tag);
    const isFlex = selNode.styles.display === "flex" || selNode.styles.display === "inline-flex";
    $("#ctx-flex").hidden = !canFlex;
    $("#ctx-flex").textContent = isFlex ? "− Flex" : "+ Flex";
    ctxBar.style.display = "flex";
    const abOffset = isArtboard(sel) ? 24 : 8;
    const bw = ctxBar.offsetWidth || 260, bh = ctxBar.offsetHeight || 30;
    const left = Math.max(12, Math.min(Math.max(12, stage.clientWidth - bw - 12), selRect.x));
    const top = Math.max(48, Math.min(Math.max(48, stage.clientHeight - bh - 68), selRect.y - bh - abOffset));
    ctxBar.style.left = `${left}px`;
    ctxBar.style.top = `${top}px`;
  } else {
    ctxBar.style.display = "none";
  }

  const agentsEl = $("#agents");
  agentsEl.innerHTML = agentNodes.map(({ id, label }) => {
    const el = elOf(id);
    if (!el) return "";
    const r = rectOnStage(el);
    return `<div class="agent-box pulse" style="left:${r.x - 2}px;top:${r.y - 2}px;width:${r.w + 4}px;height:${r.h + 4}px"><span>${esc(label)}</span></div>`;
  }).join("");
  const hovEl = hoverId && hoverId !== sel && elOf(hoverId);
  placeBox($("#hover-box"), hovEl ? rectOnStage(hovEl) : null);
}

const ICONS = {
  frame: "#",
  row: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="5" height="10" rx="1"/><rect x="9.5" y="3" width="5" height="10" rx="1"/></svg>`,
  col: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="1.5" width="10" height="5" rx="1"/><rect x="3" y="9.5" width="10" height="5" rx="1"/></svg>`,
  box: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/></svg>`,
  vec: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5 14 4v4.5c0 3.3-2.6 5.4-6 6.5-3.4-1.1-6-3.2-6-6.5V4z"/></svg>`,
  img: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M2 12l4-4 3 3 2-2 3 3"/></svg>`,
};
function iconFor(n) {
  if (n.parentId === S.rootId) return ICONS.frame;
  if (n.tag === "img") return ICONS.img;
  if (SVG_TAGS.has(n.tag)) return ICONS.vec;
  if (isTextNode(n.id)) return "Aa";
  if (n.styles.display === "flex") return n.styles.flexDirection === "column" ? ICONS.col : ICONS.row;
  return ICONS.box;
}

let layerFilter = "";
function renderLayers() {
  if (!S) return;
  for (let p = sel && S.nodes[sel]?.parentId; p && p !== S.rootId; p = S.nodes[p]?.parentId) expanded.add(p);
  const agentIds = new Set(agentNodes.map((a) => a.id));
  const q = layerFilter.trim().toLowerCase();
  const out = [];
  const rowTrail = (n, id, isAgent) => {
    const dim = n.parentId === S.rootId ? `<span class="dim">${esc(px(n.styles.width || "auto"))}×${esc(px(n.styles.height || "auto"))}</span>` : "";
    const mcp = isAgent ? `<span class="mcp-badge">MCP</span>` : "";
    return `${mcp}${dim}`;
  };
  if (q) {
    const match = (n) => n.name.toLowerCase().includes(q) || n.tag.toLowerCase().includes(q) || (n.text && n.text.toLowerCase().includes(q));
    const visit = (id) => {
      const n = S.nodes[id];
      if (!n) return;
      if (match(n)) {
        const isAgent = agentIds.has(id);
        out.push(`<div class="row${id === sel ? " sel" : ""}${isAgent ? " agent-editing" : ""}" role="treeitem" data-id="${id}" style="--d:0">` +
          `<span class="tw none"></span><span class="ic">${iconFor(n)}</span><span class="nm">${esc(n.name)}</span>${rowTrail(n, id, isAgent)}</div>`);
      }
      n.children.forEach(visit);
    };
    S.nodes[S.rootId].children.forEach(visit);
  } else {
    const walk = (id, depth) => {
      const n = S.nodes[id];
      const has = n.children.length > 0;
      const open = expanded.has(id);
      const isAgent = agentIds.has(id);
      out.push(`<div class="row${id === sel ? " sel" : ""}${isAgent ? " agent-editing" : ""}" role="treeitem" draggable="true" data-id="${id}" style="--d:${depth}">` +
        `<span class="tw ${has ? (open ? "open" : "") : "none"}" data-twist></span><span class="ic">${iconFor(n)}</span>` +
        `<span class="nm">${esc(n.name)}</span>${rowTrail(n, id, isAgent)}</div>`);
      if (has && open) n.children.forEach((c) => walk(c, depth + 1));
    };
    S.nodes[S.rootId].children.forEach((c) => walk(c, 0));
  }
  layersEl.innerHTML = out.join("") || `<div class="kv" style="padding:8px 10px">${q ? "No matching layers." : "No layers yet — press F and draw a frame."}</div>`;
  layersEl.querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
}

// ---------------------------------------------------------------------------
// Inspector
// ---------------------------------------------------------------------------
const fld = (label, key, value, extra = "") =>
  `<label class="fld${extra.includes("disabled") ? " off" : ""}"><span>${label}</span><input data-style="${key}" value="${esc(px(value))}" ${extra}></label>`;
const hex6 = (v) => {
  const s = String(v || "").trim();
  if (/^#[0-9a-f]{6}$/i.test(s)) return s;
  if (/^#[0-9a-f]{8}$/i.test(s)) return s.slice(0, 7);
  if (/^#[0-9a-f]{3}$/i.test(s)) return `#${[...s.slice(1)].map((c) => c + c).join("")}`;
  const m = /^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(s);
  if (m) return "#" + [m[1], m[2], m[3]].map((x) => Math.max(0, Math.min(255, Number(x))).toString(16).padStart(2, "0")).join("");
  return "#ffffff";
};
const colorFld = (key, value, placeholder = "none", data = "data-style") => {
  const isEmpty = !value || value === "transparent";
  return `<label class="fld"><span class="swatch${isEmpty ? " empty" : ""}" style="${isEmpty ? "" : `background:${esc(value)}` }"><input type="color" ${data}="${key}" value="${hex6(value)}"></span>` +
    `<input ${data}="${key}" value="${esc(value || "")}" placeholder="${placeholder}" style="font-family:var(--font-mono);font-size:11px"></label>`;
};

function alignGrid(st) {
  const col = st.flexDirection === "column";
  const vals = ["flex-start", "center", "flex-end"];
  const norm = (v) => (v === "start" ? "flex-start" : v === "end" ? "flex-end" : v || "flex-start");
  const j = norm(st.justifyContent), a = norm(st.alignItems);
  let cells = "";
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const jj = col ? vals[r] : vals[c], aa = col ? vals[c] : vals[r];
    cells += `<button data-action="align" data-j="${jj}" data-a="${aa}" class="${jj === j && aa === a ? "on" : ""}" title="${jj} / ${aa}"></button>`;
  }
  return `<div class="align-grid">${cells}</div>`;
}

function nodePanel(n) {
  const st = n.styles;
  const ab = n.parentId === S.rootId;
  const abs = st.position === "absolute";
  const flex = st.display === "flex" || st.display === "inline-flex";
  const texty = !VOID_TAGS.has(n.tag) && (n.text !== "" || TEXT_TAGS.has(n.tag));
  const posOpts = ["static", "relative", "absolute"].map((p) => `<option ${(st.position || "static") === p ? "selected" : ""}>${p}</option>`).join("");
  const dispOpts = [["", "default"], ["block", "block"], ["flex", "flex"], ["inline-flex", "inline-flex"], ["grid", "grid"], ["inline-block", "inline-block"], ["none", "none"]].map(([v, l]) => `<option value="${v}" ${(st.display || "") === v ? "selected" : ""}>${l}</option>`).join("");
  const tagOpts = TAGS.map((t) => `<option ${t === n.tag ? "selected" : ""}>${t}</option>`).join("");
  const presets = ab ? [["390×844", 390, 844], ["768×1024", 768, 1024], ["1440×900", 1440, 900], ["Auto H", null, "fit-content"]] : [];
  const weights = ["", "100", "200", "300", "400", "500", "600", "700", "800", "900"].map((w) => `<option value="${w}" ${String(st.fontWeight || "") === w ? "selected" : ""}>${w || "—"}</option>`).join("");
  const opacity = st.opacity == null ? "100" : String(Math.round(num(st.opacity, 1) * 100));
  return `
  <div class="sec">
    <div class="grid2"><label class="fld wide"><span>Name</span><input data-field="name" value="${esc(n.name)}"></label></div>
    <div class="grid2">
      <label class="fld"><span>Tag</span><select data-field="tag" style="font-family:var(--font-mono);font-size:11px">${tagOpts}</select></label>

function renderInspector(force = false) {
  if (!S) return;
  const a = document.activeElement;
  if (!force && inspector.contains(a) && a.matches("input:not([type=checkbox]):not([type=color]), textarea, select")) { inspectorDirty = true; return; }
  inspectorDirty = false;
  const n = sel && S.nodes[sel];
  const scroll = inspector.scrollTop;
  renderRightHead(n);
  inspector.innerHTML = n ? nodePanel(n) : pagePanel();
  if (n) {
    inspectorFoot.hidden = false;
    inspectorFoot.innerHTML = `<div class="btnrow"><button class="btn primary" data-action="copy" data-format="html">Copy HTML + CSS</button><button class="btn" data-action="copy" data-format="jsx">Copy JSX</button></div>`;
  } else {
    inspectorFoot.hidden = true;
    inspectorFoot.innerHTML = "";
  }
  inspector.scrollTop = scroll;
}

function parseVal(raw, kind) {
  const t = raw.trim();
  if (t === "") return null;
  if (kind === "percent") return Math.max(0, Math.min(100, num(t, 100))) / 100;
  if (kind === "font") return fontStack(t);
  return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : t;
}

inspector.addEventListener("input", (e) => {
  if (e.target.matches('.swatch input[type="color"]')) {
    const sw = e.target.closest(".swatch");
    const txt = e.target.closest(".fld")?.querySelector('input:not([type="color"])');
    if (sw) { sw.classList.remove("empty"); sw.style.background = e.target.value; }
    if (txt) txt.value = e.target.value;
  }
});
inspector.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "font-file") return uploadFonts([...t.files]);
  if (t.id === "google-family") return;
  if (t.id === "css-json") return;
  if (t.dataset.page) return patchStyles(S.rootId, { backgroundColor: t.value || null });
  if (!sel) return;
  if (t.dataset.style) {
    const key = t.dataset.style;
    let value = t.type === "checkbox" ? (t.checked ? t.value : null) : parseVal(t.value, t.dataset.kind);
    if (key === "lineHeight" && typeof value === "number" && value >= 4) value = `${value}px`;
    const styles = { [key]: value };
    if (key === "position" && value === "absolute") {
      const el = elOf(sel);
      if (el) Object.assign(styles, { left: Math.round(el.offsetLeft), top: Math.round(el.offsetTop) });
    }
    if (key === "position" && value !== "absolute") Object.assign(styles, { left: null, top: null });
    patchStyles(sel, styles);
  } else if (t.dataset.field) {
    patch(sel, { [t.dataset.field]: t.value });
  } else if (t.dataset.attr) {
    patch(sel, { attrs: { [t.dataset.attr]: t.value || null } });
  }
});
const STEP_KEYS = new Set(["left", "top", "width", "height", "fontSize", "borderRadius", "gap", "padding", "opacity"]);
inspector.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "css-json" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    inspector.querySelector('[data-action="apply-css"]')?.click();
    return;
  }
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && e.target.matches("input[data-style]") && STEP_KEYS.has(e.target.dataset.style)) {
    const raw = e.target.value.trim();
    if (/^-?\d+(\.\d+)?$/.test(raw)) {
      e.preventDefault();
      const step = (e.key === "ArrowUp" ? 1 : -1) * (e.shiftKey ? 10 : 1);
      const next = Math.round((Number(raw) + step) * 100) / 100;
      e.target.value = String(e.target.dataset.kind === "percent" ? Math.max(0, Math.min(100, next)) : next);
      e.target.dispatchEvent(new Event("change", { bubbles: true }));
    }
    return;
  }
  if (e.key === "Enter" && e.target.id === "google-family") { e.preventDefault(); $("#right").querySelector('[data-action="add-google"]')?.click(); return; }
  if (e.key === "Enter" && e.target.matches("input")) e.target.blur();
  if (e.key === "Escape" && e.target.matches("input, textarea")) { e.target.blur(); renderInspector(true); }
});
inspector.addEventListener("focusout", () => setTimeout(() => {
  if (inspectorDirty && !inspector.contains(document.activeElement)) renderInspector(true);
}));

$("#right").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const act = b.dataset.action;
  if (act === "copy") return copyExport(b.dataset.format, sel);
  if (act === "export-zip") return downloadZip(S?.id, b.dataset.format || "html");
  if (act === "copy-mcp") return copyText($("#mcp-cmd").textContent, "Copied MCP command");
  if (act === "page-bg") return patchStyles(S.rootId, { backgroundColor: b.dataset.bg });
  if (act === "toggle-css-json") { cssJsonOpen = !cssJsonOpen; return renderInspector(true); }
  if (act === "remove-font") {
    const f = fontLib.find((x) => x.id === b.dataset.id);
    if (f && confirm(`Remove ${f.family} from the font library? Layers using it fall back to their fallback fonts.`)) await api("DELETE", `/api/fonts/${encodeURIComponent(f.id)}`);
    return;
  }
  if (act === "add-google") {
    const family = $("#google-family").value.trim();
    if (!family) return toast("Type a Google Fonts family name");
    if (await api("POST", "/api/fonts/google", { family })) toast(`Added ${family}`);
    return;
  }
  if (!sel) return;
  const n = S.nodes[sel];
  if (act === "zoom-sel") return zoomCmd("selection");
  if (act === "preset-size") {
    const styles = { height: b.dataset.h === "fit-content" ? "fit-content" : Number(b.dataset.h) };
    if (b.dataset.w) styles.width = Number(b.dataset.w);
    return patchStyles(sel, styles);
  }
  if (act === "delete") return removeSelected();
  if (act === "duplicate") return duplicateSelected();
  if (act === "flex") return patchStyles(sel, { display: "flex", flexDirection: n.styles.flexDirection || "column", gap: n.styles.gap || 8 });
  if (act === "unflex") return patchStyles(sel, { display: null, flexDirection: null, justifyContent: null, alignItems: null, gap: null, flexWrap: null });
  if (act === "dir") return patchStyles(sel, { flexDirection: b.dataset.dir });
  if (act === "align") return patchStyles(sel, { justifyContent: b.dataset.j, alignItems: b.dataset.a });
  if (act === "textAlign") return patchStyles(sel, { textAlign: b.dataset.v === "left" ? null : b.dataset.v });
  if (act === "clear") return patchStyles(sel, { [b.dataset.key]: null });
  if (act === "apply-css") {
    let styles;
    try { styles = JSON.parse($("#css-json").value); } catch (err) { return toast(`Invalid JSON: ${err.message}`); }
    if (!styles || typeof styles !== "object" || Array.isArray(styles)) return toast("CSS must be a JSON object");
    if (await patch(sel, { styles, replaceStyles: true })) toast("CSS applied");
  }
});

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(msg);
}

async function copyExport(format, nodeId) {
  const q = new URLSearchParams({ format });
  if (nodeId) q.set("nodeId", nodeId);
  const code = await api("GET", `/api/export?${q}`);
  if (typeof code === "string") copyText(code, format === "jsx" ? "Copied JSX" : "Copied HTML + CSS");
}

async function downloadZip(projectId = S?.id, format = "html") {
  if (!projectId) return;
  const q = new URLSearchParams({ projectId, format });
  try {
    const res = await fetch(`/api/export/zip?${q}`);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || res.statusText);
    }
    const blob = await res.blob();
    const cd = res.headers.get("content-disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const fileName = m ? m[1] : "project.zip";
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: fileName });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`Exported ${fileName}`);
  } catch (err) {
    toast(err.message);
  }
}
