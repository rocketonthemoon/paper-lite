[package]
name = "weft-render"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders weft artboards with Blitz (HTML/CSS in Rust): screenshots and computed styles, no headless Chrome"

[dependencies]
blitz-html = "=0.3.0-beta.6"
blitz-dom = { version = "=0.3.0-beta.6", features = ["floats"] }
blitz-paint = "=0.3.0-beta.6"
blitz-traits = "=0.3.0-beta.6"
blitz-net = "=0.3.0-beta.6"
anyrender = "0.15.1"
anyrender_vello_cpu = { version = "0.19.0", features = ["multithreading", "filters"] }
peniko = "0.6.0"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4
